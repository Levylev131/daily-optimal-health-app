<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cold Therapy Guide — Daily Optimal Health</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --acc: #2dd46e; --glow: rgba(45,212,110,0.35);
      --bg1: #061a0c; --bg2: #0d4a24;
      --glass: rgba(255,255,255,0.07); --glass-b: rgba(255,255,255,0.13);
      --glass-h: rgba(255,255,255,0.12);
      --text: #f0fff4; --muted: rgba(240,255,244,0.55);
      --r: 14px; --r-sm: 10px; --amber: #f5a623;
    }
    html { min-height: 100%; scroll-behavior: smooth; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg1)); background-size: 400% 400%; animation: gradShift 18s ease infinite; color: var(--text); min-height: 100vh; overflow-x: hidden; }
    @keyframes gradShift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
    .top-bar { display: flex; align-items: center; gap: 12px; padding: 14px 24px; max-width: 860px; margin: 0 auto; border-bottom: 1px solid var(--glass-b); position: sticky; top: 0; z-index: 100; background: rgba(6,26,12,0.85); backdrop-filter: blur(16px); }
    .back-btn { color: var(--muted); font-size: .88rem; font-weight: 600; transition: color .2s; background: none; border: none; cursor: pointer; }
    .back-btn:hover { color: var(--acc); }
    .top-title { flex: 1; text-align: center; font-size: 1rem; font-weight: 800; text-shadow: 0 0 20px var(--glow); }
    .top-spacer { width: 60px; }
    .page { max-width: 860px; margin: 0 auto; padding: clamp(16px,4vw,28px) clamp(12px,3vw,20px) 100px; }
    .hero { text-align: center; padding: clamp(24px,5vw,40px) 0 clamp(20px,4vw,32px); }
    .hero-emoji { font-size: clamp(2.8rem,8vw,4.2rem); display: block; margin-bottom: 12px; filter: drop-shadow(0 0 18px var(--glow)); }
    .hero-title { font-size: clamp(1.7rem,5vw,2.8rem); font-weight: 900; letter-spacing: -1px; line-height: 1.1; background: linear-gradient(135deg, #fff 30%, var(--acc)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 10px; }
    .hero-sub { color: var(--muted); font-size: clamp(.85rem,2vw,1rem); max-width: 500px; margin: 0 auto; line-height: 1.65; }
    .card { background: var(--glass); border: 1px solid var(--glass-b); border-radius: var(--r); backdrop-filter: blur(12px); margin-bottom: 12px; overflow: hidden; scroll-margin-top: 72px; transition: border-color .2s; }
    .card.open { border-color: rgba(45,212,110,0.35); }
    .card-header { display: flex; align-items: center; gap: 14px; padding: clamp(14px,3vw,20px); cursor: pointer; transition: background .15s; user-select: none; }
    .card-header:hover { background: var(--glass-h); }
    .card-icon { font-size: clamp(1.8rem,4vw,2.4rem); flex-shrink: 0; width: clamp(48px,9vw,62px); height: clamp(48px,9vw,62px); background: rgba(45,212,110,0.1); border: 1px solid rgba(45,212,110,0.2); border-radius: 14px; display: flex; align-items: center; justify-content: center; }
    .card-meta { flex: 1; min-width: 0; }
    .card-name { font-size: clamp(.98rem,2.6vw,1.18rem); font-weight: 900; margin-bottom: 3px; }
    .card-tagline { color: var(--muted); font-size: .8rem; }
    .expand-arrow { color: var(--muted); font-size: .8rem; transition: transform .25s; flex-shrink: 0; }
    .card.open .expand-arrow { transform: rotate(180deg); }
    .card-body { max-height: 0; overflow: hidden; transition: max-height .4s cubic-bezier(.4,0,.2,1); border-top: 1px solid transparent; }
    .card.open .card-body { max-height: 2000px; border-top-color: var(--glass-b); }
    .card-inner { padding: clamp(16px,3vw,24px); display: flex; flex-direction: column; gap: 16px; }
    .points { display: flex; flex-direction: column; gap: 10px; }
    .point { display: flex; gap: 11px; align-items: flex-start; font-size: .85rem; line-height: 1.6; }
    .point-dot { width: 20px; height: 20px; border-radius: 50%; background: rgba(45,212,110,0.18); color: var(--acc); font-size: .72rem; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
    .sec-lbl { font-size: .66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 9px; display: flex; align-items: center; gap: 8px; }
    .sec-lbl::after { content:''; flex:1; height:1px; background: var(--glass-b); }
    .protocol-box { background: rgba(255,255,255,0.04); border: 1px solid var(--glass-b); border-radius: var(--r-sm); padding: 14px; font-size: .83rem; line-height: 1.65; color: rgba(240,255,244,0.85); }
    .tip-box { background: rgba(245,166,35,0.07); border: 1px solid rgba(245,166,35,0.25); border-radius: var(--r-sm); padding: 12px 15px; font-size: .81rem; line-height: 1.65; }
    .tip-label { color: var(--amber); font-weight: 800; font-size: .68rem; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 4px; }
  </style>
  <script src="health-notifications.js" defer></script>
</head>
<body>
<div class="top-bar">
  <button class="back-btn" onclick="history.back()">← Back</button>
  <div class="top-title">🧊 Cold Therapy Guide</div>
  <div class="top-spacer"></div>
</div>
<div class="page">
  <div class="hero">
    <span class="hero-emoji">❄️</span>
    <div class="hero-title">Cold Therapy — The Deep Dive</div>
    <div class="hero-sub">A 250% dopamine spike. Reduced inflammation. Mental resilience. Cold exposure is one of the most studied and least understood practices in modern health — here's exactly how it works.</div>
  </div>
  <div id="cardList"></div>
</div>
<script>
const CARDS = [
  {
    id: 'cold-showers',
    emoji: '🚿',
    name: 'Cold Showers',
    tagline: 'The entry-point protocol — accessible, daily, and surprisingly powerful',
    points: [
      'A single cold shower raises norepinephrine by 300–500% and dopamine by 250%. The dopamine elevation is sustained for 2–3 hours without a crash or tolerance development — higher than any recreational stimulant.',
      'A 2023 RCT (n=3,000+) found that ending showers with cold for 30–90 seconds reduced sick days by 29% over 90 days compared to warm shower controls.',
      'The controlled breathing required to tolerate cold directly trains the HPA stress response system — reducing reactivity to non-cold stressors over time.',
      'Daily cold exposure measurably improves heart rate variability (HRV) over 4–8 weeks — the most widely used objective marker of autonomic nervous system resilience.',
    ],
    protocol: 'End every shower with cold water only. Start with 15–30 seconds and increase over 2 weeks. The cold shock (gasp reflex + rapid breathing) peaks in the first 30–60 seconds — controlled nasal breathing is the key skill. Once breathing is controlled, discomfort drops substantially. Week 1: 15–30 sec. Week 2: 60 sec. Week 3: 90–120 sec. Week 4+: full cold showers (3+ min). Morning preferred for dopamine alignment.',
    tip: 'The cold shock response (gasping, rapid breathing) is a physiological reflex — not a measure of bravery or weakness. It passes within 30–60 seconds for almost everyone. The practice is learning to control your breathing during that window. Once you can maintain slow nasal breathing through the first 60 seconds, cold exposure becomes a choice rather than an ordeal.',
  },
  {
    id: 'ice-baths',
    emoji: '🛁',
    name: 'Ice Baths & Cold Plunge',
    tagline: 'Full immersion — higher magnitude, deeper benefits, bigger commitment',
    points: [
      'Full-body cold water immersion produces a significantly larger norepinephrine and dopamine response than cold showers — the greater skin surface area exposure amplifies all physiological signals proportionally.',
      'Reduces delayed onset muscle soreness (DOMS) by 20–30% in meta-analyses of exercise recovery protocols — a consistent, replicated finding across sports science literature.',
      'Activates brown adipose tissue (BAT) — metabolically active fat that generates heat through thermogenesis, burning calories. Regular cold immersion increases BAT mass and activity over time, raising baseline metabolic rate.',
      '11 minutes of weekly cold water immersion (across 2–4 sessions) is the research-backed minimum effective dose for metabolic and mood benefits (Søberg et al., 2022).',
    ],
    protocol: 'Target water temperature: 10–15°C (50–59°F). Submerge to the neck — head out is fine. Enter slowly and calm your breathing before full immersion. Focus on long, slow exhales. 2–3 minutes minimum for measurable benefits. Frequency: 2–4 sessions/week for minimum effective dose (11 min/week total). Never alone — cold water immersion carries real physiological risk.',
    tip: 'You don\'t need ice. Cold tap water in most regions runs at 55–65°F (13–18°C) in winter — squarely in the research-backed range. Professional athletes use ice primarily for rapid temperature drop, not because ice is required. A bathtub with cold tap water for 10 minutes is the accessible, equivalent protocol.',
  },
  {
    id: 'contrast-therapy',
    emoji: '🔥',
    name: 'Contrast Therapy (Hot / Cold)',
    tagline: 'The vascular pump — alternating heat and cold amplifies recovery beyond either alone',
    points: [
      'Alternating heat and cold creates a "vascular pump" — forced cycles of vasodilation (heat) and vasoconstriction (cold) drive blood in and out of tissues, enhancing metabolic waste removal and nutrient delivery.',
      'Reduces muscle soreness more than cold alone in head-to-head trials — the heat phase drives blood and lymph into tissue, and the cold phase flushes it out, rapidly clearing lactate and inflammatory mediators.',
      '4+ sauna sessions per week independently reduce all-cause mortality by 35% and cardiovascular mortality by 40% in a 20-year Finnish cohort (Laukkanen et al., 2018). Adding cold amplifies the cardiovascular benefit.',
      'Contrast therapy enhances the growth hormone pulse triggered by sauna — heat stress triggers GH release, and the cold plunge prevents the gradual rewarming that blunts the peak.',
    ],
    protocol: '3–4 rounds of: 12–15 min sauna (80–100°C) → 2–3 min cold (<15°C). End on cold for energy and alertness; end on heat for relaxation and sleep preparation. Minimum 2 rounds for cardiovascular benefit; 3–4 for peak recovery. Hydrate: 500ml water per 20 min of heat. Avoid within 4 hours of bedtime — thermogenic rewarming delays sleep.',
    tip: 'Cold therapy immediately after strength training suppresses the inflammation that signals muscle adaptation — you\'re muting the growth signal. The research is consistent: use cold for mental health, metabolic benefits, and mood on non-training days or after cardio. Save contrast therapy for rest days. Zone 2 cardio + contrast therapy is a powerful recovery day combination.',
  },
  {
    id: 'breathing-cold',
    emoji: '💨',
    name: 'Breathing During Cold Exposure',
    tagline: 'The cold shock response is controlled by your breath — learn this first',
    points: [
      'The cold shock reflex (gasping, hyperventilation) is an involuntary response to cold water contact — controlled nasal breathing directly overrides this reflex, reducing the subjective stress response by 30–50% within 60 seconds.',
      'Extended exhales during cold exposure activate the vagus nerve and shift the autonomic nervous system toward parasympathetic dominance — the opposite physiological state to the panic response cold initially triggers.',
      'Practicing controlled breathing under cold stress is real-world stress inoculation — the skill transfers to other acute stressors as the brain learns that the stress response can be voluntarily regulated.',
      'Heart rate variability (HRV) shows measurable acute improvement during cold exposure when breathing is controlled — the combination of cold + controlled exhalation creates an unusually strong vagal stimulus.',
    ],
    protocol: 'Pre-cold: 3–5 rounds of slow box breathing (4-count inhale, 4-count hold, 4-count exhale, 4-count hold) to pre-load the parasympathetic state. During cold: prioritize the exhale — long, slow exhales through the nose. The shock reflex wants you to gasp; the counter-move is a controlled, extended exhale. Reset tool: physiological sigh (2 quick nasal inhales + one long exhale) works in under 10 seconds.',
    tip: 'Practice box breathing in neutral environments until it\'s automatic — during showering, while waiting, while walking. During cold exposure, higher cognition shuts down fast. You need the breathing pattern available below the level of conscious thought, not as something you have to actively remember to do.',
  },
  {
    id: 'cold-timing',
    emoji: '⏱️',
    name: 'Cold Timing & Circadian Integration',
    tagline: 'When you expose matters — morning vs evening changes what cold actually does',
    points: [
      'Morning cold exposure (within 2 hours of waking) aligns with the natural cortisol awakening response — the combination produces a more powerful, longer-lasting energy and focus window than caffeine alone, without a crash.',
      'Evening cold exposure triggers thermogenic rewarming as the body fights to restore core temperature — this rewarming can elevate core temperature and delay sleep onset by 1–2 hours, even if the cold itself felt relaxing.',
      'The dopamine spike from cold is most beneficial when it occurs in the early part of the circadian day — stacking morning light + cold creates a robust dopamine and cortisol morning state.',
      'Timing cold after strength training blunts the post-exercise anabolic signal — optimal use is pre-workout for mental activation, or post-workout only when recovery (not adaptation) is the priority.',
    ],
    protocol: 'Best window: 30 minutes to 2 hours after waking. Acceptable: early afternoon (2–4pm). Hard avoidance: within 4 hours of target bedtime. Morning sequence: wake → outdoor light exposure (10 min) → cold shower (2–3 min) → delay caffeine 90 min. This 3-step morning protocol stacks dopamine, cortisol, and circadian anchoring simultaneously.',
    tip: 'The thermogenic rewarming after cold is not relaxation — it\'s your body burning calories to restore core temperature. This process raises core temperature, which is the opposite of what\'s needed for sleep onset. Morning cold is free energy; evening cold is borrowed energy repaid from sleep.',
  },
  {
    id: 'cold-adaptation',
    emoji: '🧬',
    name: 'Cold Adaptation Over Time',
    tagline: 'What changes physiologically after weeks and months of regular cold exposure',
    points: [
      'Brown adipose tissue (BAT) increases in both mass and metabolic activity with regular cold exposure over 4–8 weeks — adapted individuals burn more calories from BAT thermogenesis at all times, not just during exposure.',
      'Cold shock protein RBM3 accumulates with regular exposure — this neuroprotective protein promotes synaptic repair and has shown protective effects against protein aggregation associated with neurodegenerative conditions.',
      'Dopamine receptor sensitivity and density upregulate with regular cold-driven stimulation — adapted practitioners report higher baseline motivation, drive, and mood independent of cold exposure sessions.',
      'Subjective cold tolerance improves measurably within 14 days of daily practice — the shock reflex diminishes, the comfortable temperature range widens, and the positive post-exposure state becomes the dominant experience.',
    ],
    protocol: 'Week 1–2: 30–60 sec cold at shower end. Week 3–4: 90–120 sec. Week 5–6: full cold shower 3 min. Week 7–8: introduce cold plunge (5 min at 60°F). Month 3+: 10–15°C full immersion, 2–4 sessions/week. Consistency drives adaptation — frequency matters more than intensity. Prioritize duration over temperature.',
    tip: 'Most people quit cold exposure between days 3 and 10 because "it hasn\'t gotten easier." Measurable cold adaptation requires 14 days minimum for nervous system changes, and 4–6 weeks for BAT and dopamine system effects. At day 14, most practitioners report a noticeable reduction in the shock response. At day 30, what felt like ordeal feels like ritual. The adaptation window is real and predictable.',
  },
  {
    id: 'cold-mental-health',
    emoji: '🧠',
    name: 'Cold Exposure & Mental Health',
    tagline: 'The dopamine pathway — uniquely targeted and unusually powerful',
    points: [
      'The dopamine elevation from cold is 250% above baseline and sustained for 2–3 hours — a longer, smoother curve than caffeine, exercise, or any recreational stimulant, without tolerance development or a crash.',
      'A 2022 RCT on cold water swimming found significant reduction in depression and anxiety scores after 6 weeks vs. thermal water controls — the first controlled trial specifically on cold exposure for mental health conditions.',
      'Unlike exercise and morning sunlight (which primarily act on serotonin + dopamine), cold specifically and disproportionately targets the dopamine pathway — uniquely relevant for low motivation, drive, or anhedonia.',
      'Regular cold exposure builds stress resilience through repeated controlled activation and deactivation of the stress response — the nervous system learns that stress is survivable and time-limited.',
    ],
    protocol: 'For mental health benefit: daily practice, even 30–60 seconds, is superior to weekly high-intensity sessions. The nervous system adapts to regular low-intensity stimulation more robustly than occasional spikes. Morning timing aligns the dopamine spike with the natural cortisol awakening response. 4–6 weeks to notice reliable improvement in baseline mood and motivation.',
    tip: 'Cold exposure targets the dopamine pathway specifically — distinct from the serotonin effects of exercise and sunlight. Many people with low motivation, ADHD-like symptoms, or anhedonia have dopamine-pathway dysfunction rather than serotonin deficiency. Cold is a uniquely direct, drug-free dopamine intervention. This doesn\'t replace professional mental health care — it\'s a complementary tool with a specific mechanism other lifestyle interventions don\'t cover.',
  },
];

const list = document.getElementById('cardList');
list.innerHTML = CARDS.map(c => `
  <div class="card" id="${c.id}">
    <div class="card-header" onclick="toggle('${c.id}')">
      <div class="card-icon">${c.emoji}</div>
      <div class="card-meta">
        <div class="card-name">${c.name}</div>
        <div class="card-tagline">${c.tagline}</div>
      </div>
      <span class="expand-arrow">▼</span>
    </div>
    <div class="card-body">
      <div class="card-inner">
        <div class="points">
          ${c.points.map((p,i) => `<div class="point"><div class="point-dot">${i+1}</div><span>${p}</span></div>`).join('')}
        </div>
        <div>
          <div class="sec-lbl">Protocol</div>
          <div class="protocol-box">${c.protocol}</div>
        </div>
        <div class="tip-box">
          <div class="tip-label">Pro Tip</div>
          ${c.tip}
        </div>
      </div>
    </div>
  </div>
`).join('');

function toggle(id) { document.getElementById(id).classList.toggle('open'); }
</script>
</body>
</html>
