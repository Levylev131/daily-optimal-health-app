<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supplement Guide — Daily Optimal Health</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --acc: #2dd46e; --glow: rgba(45,212,110,0.35);
      --bg1: #061a0c; --bg2: #0d4a24;
      --glass: rgba(255,255,255,0.07); --glass-b: rgba(255,255,255,0.13);
      --glass-h: rgba(255,255,255,0.12);
      --text: #f0fff4; --muted: rgba(240,255,244,0.55);
      --r: 14px; --r-sm: 10px; --amber: #f5a623;
    }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg1));
      background-size: 400% 400%; animation: gradShift 18s ease infinite;
      color: var(--text); min-height: 100vh; overflow-x: hidden;
    }
    @keyframes gradShift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
    .top-bar { display: flex; align-items: center; gap: 12px; padding: 14px 24px; max-width: 860px; margin: 0 auto; border-bottom: 1px solid var(--glass-b); position: sticky; top: 0; z-index: 100; background: rgba(6,26,12,0.85); backdrop-filter: blur(16px); }
    .back-btn { color: var(--muted); font-size: .88rem; font-weight: 600; transition: color .2s; background: none; border: none; cursor: pointer; }
    .back-btn:hover { color: var(--acc); }
    .top-title { flex: 1; text-align: center; font-size: 1rem; font-weight: 800; text-shadow: 0 0 20px var(--glow); }
    .top-spacer { width: 60px; }
    .page { max-width: 860px; margin: 0 auto; padding: clamp(16px,4vw,28px) clamp(12px,3vw,20px) 100px; }
    .hero { text-align: center; padding: clamp(24px,5vw,40px) 0 clamp(20px,4vw,32px); }
    .hero-emoji { font-size: clamp(2.8rem,8vw,4.2rem); display: block; margin-bottom: 12px; filter: drop-shadow(0 0 18px var(--glow)); }
    .hero-title { font-size: clamp(1.7rem,5vw,2.8rem); font-weight: 900; letter-spacing: -1px; line-height: 1.1; background: linear-gradient(135deg, #fff 30%, var(--acc)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 10px; }
    .hero-sub { color: var(--muted); font-size: clamp(.85rem,2vw,1rem); max-width: 500px; margin: 0 auto; line-height: 1.65; }
    .card { background: var(--glass); border: 1px solid var(--glass-b); border-radius: var(--r); backdrop-filter: blur(12px); margin-bottom: 12px; overflow: hidden; scroll-margin-top: 72px; transition: border-color .2s; }
    .card.open { border-color: rgba(45,212,110,0.35); }
    .card-header { display: flex; align-items: center; gap: 14px; padding: clamp(14px,3vw,20px); cursor: pointer; transition: background .15s; user-select: none; }
    .card-header:hover { background: var(--glass-h); }
    .card-icon { font-size: clamp(1.8rem,4vw,2.4rem); flex-shrink: 0; width: clamp(48px,9vw,62px); height: clamp(48px,9vw,62px); background: rgba(45,212,110,0.1); border: 1px solid rgba(45,212,110,0.2); border-radius: 14px; display: flex; align-items: center; justify-content: center; }
    .card-meta { flex: 1; min-width: 0; }
    .card-name { font-size: clamp(.98rem,2.6vw,1.18rem); font-weight: 900; margin-bottom: 3px; }
    .card-tagline { color: var(--muted); font-size: .8rem; }
    .expand-arrow { color: var(--muted); font-size: .8rem; transition: transform .25s; flex-shrink: 0; }
    .card.open .expand-arrow { transform: rotate(180deg); }
    .card-body { max-height: 0; overflow: hidden; transition: max-height .4s cubic-bezier(.4,0,.2,1); border-top: 1px solid transparent; }
    .card.open .card-body { max-height: 2000px; border-top-color: var(--glass-b); }
    .card-inner { padding: clamp(16px,3vw,24px); display: flex; flex-direction: column; gap: 16px; }
    .points { display: flex; flex-direction: column; gap: 10px; }
    .point { display: flex; gap: 11px; align-items: flex-start; font-size: .85rem; line-height: 1.6; }
    .point-dot { width: 20px; height: 20px; border-radius: 50%; background: rgba(45,212,110,0.18); color: var(--acc); font-size: .72rem; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
    .sec-lbl { font-size: .66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 9px; display: flex; align-items: center; gap: 8px; }
    .sec-lbl::after { content:''; flex:1; height:1px; background: var(--glass-b); }
    .protocol-box { background: rgba(255,255,255,0.04); border: 1px solid var(--glass-b); border-radius: var(--r-sm); padding: 14px; font-size: .83rem; line-height: 1.65; color: rgba(240,255,244,0.85); }
    .tip-box { background: rgba(245,166,35,0.07); border: 1px solid rgba(245,166,35,0.25); border-radius: var(--r-sm); padding: 12px 15px; font-size: .81rem; line-height: 1.65; }
    .tip-label { color: var(--amber); font-weight: 800; font-size: .68rem; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 4px; }
  </style>
  <script src="health-notifications.js" defer></script>
</head>
<body>
<div class="top-bar">
  <button class="back-btn" onclick="history.back()">← Back</button>
  <div class="top-title">💊 Supplement Guide</div>
  <div class="top-spacer"></div>
</div>
<div class="page">
  <div class="hero">
    <span class="hero-emoji">🧬</span>
    <div class="hero-title">Evidence-Based Supplement Stack</div>
    <div class="hero-sub">The 8 supplements with the strongest human research behind them — what they do, the exact dose that works, and why the form matters more than you think.</div>
  </div>
  <div id="cardList"></div>
</div>
<script>
const CARDS = [
  {
    id: 'magnesium',
    emoji: '🪨',
    name: 'Magnesium Glycinate',
    tagline: 'The foundational mineral — deficient in 50–68% of adults, cheap to fix',
    points: [
      '50–68% of adults are magnesium deficient due to soil depletion, processed food diets, and high stress — the most prevalent micronutrient deficiency in the developed world.',
      'Reduces anxiety symptoms via GABA receptor sensitization — GABA is the nervous system\'s primary inhibitory neurotransmitter, and magnesium is required for its receptors to function properly.',
      'Improves sleep onset, sleep quality, and reduces nighttime cortisol in randomized controlled trials in deficient adults — one of the most cost-effective sleep interventions available.',
      'Required co-factor for 300+ enzymatic reactions including ATP synthesis — chronic deficiency quietly impairs energy production, DNA repair, and protein synthesis simultaneously.',
    ],
    protocol: 'Dose: 200–400mg elemental magnesium as glycinate, 30–60 minutes before bed. Start at 200mg and increase if needed. Glycinate form binds magnesium to glycine (itself calming and sleep-promoting) — best absorbed and best tolerated for nighttime use. For cognitive focus: Magnesium L-Threonate (145mg elemental, taken morning) crosses the blood-brain barrier more effectively.',
    tip: 'Most "high-dose magnesium" supplements contain oxide — a form chosen for its density (physically small per mg), not absorption. Check the label for the form, not just the mg count. 200mg of glycinate delivers meaningfully more elemental magnesium to your cells than 1000mg of oxide. Oxide is only 4% absorbed.',
  },
  {
    id: 'omega3',
    emoji: '🐟',
    name: 'Omega-3 (EPA & DHA)',
    tagline: 'Anti-inflammatory foundation — the most impactful supplement for brain and cardiovascular health',
    points: [
      'High-dose EPA (≥2g/day) is as effective as SSRIs for major depression in several meta-analyses — the antidepressant mechanism is anti-inflammatory rather than neurotransmitter-focused.',
      'DHA is the primary structural component of neuronal cell membranes, comprising 40% of brain gray matter phospholipids — dietary DHA directly determines neuronal membrane fluidity and synaptic signaling efficiency.',
      'Reduces triglycerides by 15–30% in a dose-dependent manner at doses of 3–4g EPA+DHA/day — rivaling statin-level effect on this cardiovascular risk marker.',
      'Meta-analysis of 40 prospective cohorts (n=135,000+) associates high omega-3 intake with 13% reduction in all-cause mortality and 18% reduction in cardiovascular mortality.',
    ],
    protocol: '2–3g total EPA+DHA daily. Mental health focus: aim for 2g+ EPA specifically. General health: 1–2g EPA+DHA minimum. Take with the largest meal of the day — fat in the meal significantly improves absorption. Read the supplement facts for EPA+DHA content specifically, not just "fish oil" milligrams.',
    tip: 'Most "fish oil 1000mg" capsules contain only 300mg of combined EPA+DHA — the other 700mg is saturated and monounsaturated fat. You\'d need 7+ capsules to hit the 2g therapeutic threshold. Look for concentrated fish oil listing EPA+DHA separately with a combined total of at least 800mg per capsule.',
  },
  {
    id: 'vitamin-d',
    emoji: '☀️',
    name: 'Vitamin D3 + K2',
    tagline: 'Deficient in 42% of Americans — regulates 2,000+ genes and doubles mortality risk when low',
    points: [
      '42% of American adults are vitamin D deficient (<20 ng/mL). Deficiency independently doubles all-cause mortality risk in large prospective cohorts — making supplementation one of the highest-ROI health interventions.',
      'Vitamin D supplementation reduces cancer mortality by 12% in a 2019 meta-analysis of 10 RCTs (n=79,000) — specifically mortality, not just incidence.',
      'Strong dose-response correlation between serum vitamin D and testosterone levels in men — those in the optimal range (50–70 ng/mL) have significantly higher testosterone than deficient counterparts.',
      'K2 (MK-7 form) directs calcium absorbed via D3 into bones and away from arterial walls. Without K2, high-dose D3 can contribute to arterial calcification.',
    ],
    protocol: 'Starting dose for deficiency (<30 ng/mL): 4,000–5,000 IU D3 daily. Maintenance (30–50 ng/mL): 2,000–3,000 IU. Always combine with K2 MK-7: 100–200mcg daily. Take with the largest, fattiest meal — absorption increases 32–50% with dietary fat. Retest blood 25(OH)D levels after 12 weeks to calibrate dose.',
    tip: 'Never take high-dose D3 (3,000+ IU) without K2 MK-7. D3 dramatically increases calcium absorption — K2 is the traffic cop that directs that calcium to bones rather than arteries. Without K2, this calcium can deposit in arterial walls. The combo is the protocol, not D3 alone. This is one of the most overlooked supplement interactions in primary care.',
  },
  {
    id: 'creatine',
    emoji: '⚡',
    name: 'Creatine Monohydrate',
    tagline: 'The most researched supplement in history — zero reasons not to take it',
    points: [
      'Over 700 peer-reviewed human studies — more than any other sports supplement. Consistently shows 5–15% strength increases in compound lifts and 3–5% lean mass gains during resistance training.',
      'Reduces cognitive impairment from sleep deprivation — a 2023 study showed 5g creatine before one night of sleep restriction maintained cognitive performance close to rested baseline.',
      'Vegetarians and vegans show the largest cognitive benefits (15–25% improvement in working memory and intelligence tests) because they have near-zero dietary creatine intake.',
      'Cellular hydration effect: creatine pulls water into muscle cells via osmosis, increasing cell volume — a direct anabolic signal that upregulates protein synthesis pathways independently of training load.',
    ],
    protocol: '5g creatine monohydrate daily, every day. Timing does not matter — with food, without food, before or after training all produce the same long-term saturation. No loading phase required. Monohydrate only — "upgraded" forms (HCl, ethyl ester, buffered) show no superiority in any direct comparison research. Cheapest source per gram is almost always best.',
    tip: 'The "loading phase" narrative comes from a 1990s study published while creatine was a new commercial product. Loading reaches full saturation in 5–7 days vs 28 days without — but for lifelong daily use, that head start is irrelevant. 5g/day is the dose. Skip loading and save your stomach.',
  },
  {
    id: 'ashwagandha',
    emoji: '🌿',
    name: 'Ashwagandha (KSM-66)',
    tagline: 'Cortisol regulation, testosterone support, and adaptogenic stress resilience',
    points: [
      'KSM-66 extract reduces cortisol by 27.9% vs. placebo in RCTs, with measurable reduction in perceived stress, anxiety scores, and serum cortisol after 60 days of supplementation.',
      '17% increase in testosterone levels in a 90-day RCT in healthy men — the mechanism appears to be via LH (luteinizing hormone) normalization rather than direct androgenic action.',
      'Reduces anxiety scores comparably to low-dose anxiolytics in multiple RCTs, without sedation, impaired cognition, or dependency — it modulates stress reactivity rather than suppressing it.',
      'Reduces C-reactive protein (CRP) and other inflammation markers in 8–12 week trials, suggesting a systemic anti-inflammatory mechanism beyond cortisol reduction alone.',
    ],
    protocol: '300–600mg KSM-66 extract daily (standardized to 5% withanolides). Take with food to improve absorption and reduce occasional GI discomfort. Can be taken morning or evening — morning targets daily cortisol reduction; evening emphasizes sleep benefits. Best results appear after 4–8 weeks of consistent use.',
    tip: 'Brand specificity matters for ashwagandha more than for creatine or magnesium. KSM-66 and Sensoril are the two patented, human-trial-validated extracts with verified withanolide content. Generic "ashwagandha 500mg" without extract designation may contain a fraction of the active compounds. The research dose is only achievable with standardized extract — not raw root powder.',
  },
  {
    id: 'nmn',
    emoji: '🔬',
    name: 'NMN / NR (NAD+ Precursors)',
    tagline: 'NAD+ declines 50% by age 50 — this is how you replenish the cellular energy currency',
    points: [
      'NAD+ declines approximately 50% between ages 20–50. Sirtuins — the longevity proteins activated by NAD+ — become progressively less active, impairing DNA repair, inflammation control, and metabolic regulation.',
      'NMN supplementation (500mg/day) improved muscle insulin sensitivity, circadian rhythm markers, and blood NAD+ levels in a 2021 human RCT — the first human proof-of-concept.',
      'NAD+ is required by PARP enzymes for DNA strand break repair — a mechanism directly linked to cancer suppression and the DNA repair capacity that declines with age.',
      'Animal models show dramatic reversal of aging biomarkers with NMN. Human data consistently shows blood NAD+ increases of 30–60% with oral supplementation.',
    ],
    protocol: 'NMN: 500–1,000mg in the morning, ideally fasted or with a light meal. Always combine with TMG (trimethylglycine / betaine) 500–1,000mg to prevent methyl group depletion that occurs during the conversion pathway. Store in a cool, dry place — NMN is sensitive to heat and moisture.',
    tip: 'Take NMN with TMG (trimethylglycine). The methylation pathway that converts NMN to NAD+ consumes methyl groups — chronic NMN supplementation without TMG can progressively deplete methylation capacity, affecting mood, gene expression, and homocysteine metabolism. Almost no consumer NMN products mention this. TMG is cheap and the dose is 500–1,000mg alongside your NMN.',
  },
  {
    id: 'ltheanine',
    emoji: '🍃',
    name: 'L-Theanine',
    tagline: 'Calm focus without sedation — and the perfect partner for caffeine',
    points: [
      'Produces "alert relaxation" — induces alpha brain waves (associated with focused, meditative states) without causing drowsiness or impairing reaction time, making it unique among anxiety-reducing compounds.',
      'The caffeine + L-theanine stack (100mg caffeine : 200mg theanine) is one of the most validated nootropic combinations in human research — reduces caffeine-induced jitteriness while maintaining and extending the focus benefit.',
      'Improves sleep quality in doses of 200–400mg taken before bed — not by causing sedation, but by reducing racing thoughts and sympathetic nervous system activation that prevent sleep onset.',
      'Matcha green tea naturally delivers approximately 35–40mg L-theanine per cup alongside 50–70mg caffeine — a 1:1 ratio that explains why matcha produces calmer, more sustained focus than equivalent-caffeine coffee.',
    ],
    protocol: 'With caffeine: 200mg per 100mg caffeine (e.g., 200mg theanine with a double espresso). For sleep: 200–400mg 30–60 min before bed. Standalone calm/focus: 100–200mg. No tolerance development has been reported in research.',
    tip: 'The 2:1 theanine:caffeine ratio found in green tea is not arbitrary — it\'s the ratio at which alpha wave induction from theanine fully counteracts caffeine\'s anxiety-producing effects while preserving focus and energy. This ratio is why Japanese green tea produces calm clarity rather than the jittery alertness of espresso, despite significant caffeine content.',
  },
  {
    id: 'berberine',
    emoji: '🟡',
    name: 'Berberine',
    tagline: '"Nature\'s metformin" — strong metabolic evidence for blood glucose and lipids',
    points: [
      'Reduces HbA1c (3-month blood glucose average) comparably to Metformin in multiple head-to-head RCTs — the most prescribed Type 2 diabetes medication in the world, available by prescription only.',
      'Lowers LDL cholesterol by 15–25% and triglycerides by 25–35% through upregulation of hepatic LDL receptors — an independent mechanism from statins that can be additive under physician guidance.',
      'Activates AMPK (the cellular "low energy" sensor), which simultaneously improves insulin sensitivity, increases fatty acid oxidation, reduces hepatic glucose production, and inhibits mTOR.',
      'Reduces BMI by 1.8 units and waist circumference by 3–4cm vs. placebo in meta-analyses — driven by improved insulin sensitivity and reduced lipogenesis, not appetite suppression.',
    ],
    protocol: '500mg with each major meal, 2–3x daily (1,000–1,500mg total). Taking with food is non-negotiable for tolerability — GI side effects (nausea, cramping) are common when taken fasted. Start with 500mg at one meal and increase over one week to allow gut flora to adjust.',
    tip: 'Berberine has real drug interactions — particularly with blood thinners (warfarin), cyclosporin, and drugs metabolized by CYP3A4 and CYP2D6. If you take any prescription medication, verify interactions with a pharmacist before starting. For otherwise healthy adults with elevated blood glucose or lipids, it is one of the most evidence-backed metabolic interventions available without a prescription.',
  },
];

const list = document.getElementById('cardList');
list.innerHTML = CARDS.map(c => `
  <div class="card" id="${c.id}">
    <div class="card-header" onclick="toggle('${c.id}')">
      <div class="card-icon">${c.emoji}</div>
      <div class="card-meta">
        <div class="card-name">${c.name}</div>
        <div class="card-tagline">${c.tagline}</div>
      </div>
      <span class="expand-arrow">▼</span>
    </div>
    <div class="card-body">
      <div class="card-inner">
        <div class="points">
          ${c.points.map((p,i) => `<div class="point"><div class="point-dot">${i+1}</div><span>${p}</span></div>`).join('')}
        </div>
        <div>
          <div class="sec-lbl">Dose & Protocol</div>
          <div class="protocol-box">${c.protocol}</div>
        </div>
        <div class="tip-box">
          <div class="tip-label">Pro Tip</div>
          ${c.tip}
        </div>
      </div>
    </div>
  </div>
`).join('');

function toggle(id) { document.getElementById(id).classList.toggle('open'); }
</script>
</body>
</html>
