<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleep Guide — Daily Optimal Health</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --acc: #2dd46e; --glow: rgba(45,212,110,0.35);
      --bg1: #061a0c; --bg2: #0d4a24;
      --glass: rgba(255,255,255,0.07); --glass-b: rgba(255,255,255,0.13);
      --glass-h: rgba(255,255,255,0.12);
      --text: #f0fff4; --muted: rgba(240,255,244,0.55);
      --r: 14px; --r-sm: 10px; --amber: #f5a623;
    }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg1));
      background-size: 400% 400%; animation: gradShift 18s ease infinite;
      color: var(--text); min-height: 100vh; overflow-x: hidden;
    }
    @keyframes gradShift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
    .top-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 24px; max-width: 860px; margin: 0 auto;
      border-bottom: 1px solid var(--glass-b); position: sticky; top: 0; z-index: 100;
      background: rgba(6,26,12,0.85); backdrop-filter: blur(16px);
    }
    .back-btn { color: var(--muted); font-size: .88rem; font-weight: 600; transition: color .2s; background: none; border: none; cursor: pointer; }
    .back-btn:hover { color: var(--acc); }
    .top-title { flex: 1; text-align: center; font-size: 1rem; font-weight: 800; text-shadow: 0 0 20px var(--glow); }
    .top-spacer { width: 60px; }
    .page { max-width: 860px; margin: 0 auto; padding: clamp(16px,4vw,28px) clamp(12px,3vw,20px) 100px; }
    .hero { text-align: center; padding: clamp(24px,5vw,40px) 0 clamp(20px,4vw,32px); }
    .hero-emoji { font-size: clamp(2.8rem,8vw,4.2rem); display: block; margin-bottom: 12px; filter: drop-shadow(0 0 18px var(--glow)); }
    .hero-title { font-size: clamp(1.7rem,5vw,2.8rem); font-weight: 900; letter-spacing: -1px; line-height: 1.1; background: linear-gradient(135deg, #fff 30%, var(--acc)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 10px; }
    .hero-sub { color: var(--muted); font-size: clamp(.85rem,2vw,1rem); max-width: 500px; margin: 0 auto; line-height: 1.65; }
    .card { background: var(--glass); border: 1px solid var(--glass-b); border-radius: var(--r); backdrop-filter: blur(12px); margin-bottom: 12px; overflow: hidden; scroll-margin-top: 72px; transition: border-color .2s; }
    .card.open { border-color: rgba(45,212,110,0.35); }
    .card-header { display: flex; align-items: center; gap: 14px; padding: clamp(14px,3vw,20px); cursor: pointer; transition: background .15s; user-select: none; }
    .card-header:hover { background: var(--glass-h); }
    .card-icon { font-size: clamp(1.8rem,4vw,2.4rem); flex-shrink: 0; width: clamp(48px,9vw,62px); height: clamp(48px,9vw,62px); background: rgba(45,212,110,0.1); border: 1px solid rgba(45,212,110,0.2); border-radius: 14px; display: flex; align-items: center; justify-content: center; }
    .card-meta { flex: 1; min-width: 0; }
    .card-name { font-size: clamp(.98rem,2.6vw,1.18rem); font-weight: 900; margin-bottom: 3px; }
    .card-tagline { color: var(--muted); font-size: .8rem; }
    .expand-arrow { color: var(--muted); font-size: .8rem; transition: transform .25s; flex-shrink: 0; }
    .card.open .expand-arrow { transform: rotate(180deg); }
    .card-body { max-height: 0; overflow: hidden; transition: max-height .4s cubic-bezier(.4,0,.2,1); border-top: 1px solid transparent; }
    .card.open .card-body { max-height: 2000px; border-top-color: var(--glass-b); }
    .card-inner { padding: clamp(16px,3vw,24px); display: flex; flex-direction: column; gap: 16px; }
    .points { display: flex; flex-direction: column; gap: 10px; }
    .point { display: flex; gap: 11px; align-items: flex-start; font-size: .85rem; line-height: 1.6; }
    .point-dot { width: 20px; height: 20px; border-radius: 50%; background: rgba(45,212,110,0.18); color: var(--acc); font-size: .72rem; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
    .sec-lbl { font-size: .66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 9px; display: flex; align-items: center; gap: 8px; }
    .sec-lbl::after { content:''; flex:1; height:1px; background: var(--glass-b); }
    .protocol-box { background: rgba(255,255,255,0.04); border: 1px solid var(--glass-b); border-radius: var(--r-sm); padding: 14px; font-size: .83rem; line-height: 1.65; color: rgba(240,255,244,0.85); }
    .tip-box { background: rgba(245,166,35,0.07); border: 1px solid rgba(245,166,35,0.25); border-radius: var(--r-sm); padding: 12px 15px; font-size: .81rem; line-height: 1.65; }
    .tip-label { color: var(--amber); font-weight: 800; font-size: .68rem; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 4px; }
  </style>
  <script src="health-notifications.js" defer></script>
</head>
<body>
<div class="top-bar">
  <button class="back-btn" onclick="history.back()">← Back</button>
  <div class="top-title">😴 Sleep Guide</div>
  <div class="top-spacer"></div>
</div>
<div class="page">
  <div class="hero">
    <span class="hero-emoji">🌙</span>
    <div class="hero-title">The Science of Sleep</div>
    <div class="hero-sub">Sleep is the single most impactful recovery and performance lever available. These are the evidence-based strategies that actually move the needle.</div>
  </div>
  <div id="cardList"></div>
</div>
<script>
const CARDS = [
  {
    id: 'sleep-architecture',
    emoji: '🧠',
    name: 'Sleep Architecture & Stages',
    tagline: 'Understanding what happens each cycle — and why the structure matters',
    points: [
      'Slow-wave sleep (NREM stage 3) consolidates declarative memory and procedural learning. REM sleep processes emotional memories and reduces their emotional charge — why sleep deprivation worsens anxiety and emotional reactivity.',
      'The glymphatic system clears toxic metabolic waste — including beta-amyloid and tau proteins linked to Alzheimer\'s — at 60% greater efficiency during sleep than during waking hours.',
      'Growth hormone peaks during the first NREM cycle (typically 11pm–1am). Physical recovery, tissue repair, and fat metabolism all depend on this early-night window.',
      'Cutting sleep short by 1 hour eliminates the most REM-rich cycles. Chronic sleep restriction below 6 hours is associated with 8x increased Alzheimer\'s risk and measurably accelerated cellular aging.',
    ],
    protocol: 'Target 7.5–9 hours to complete 5–6 full 90-minute cycles. Set a fixed wake time and work backwards to your bedtime. The first 2 cycles (3 hours) carry the most slow-wave sleep and are non-negotiable for physical recovery. Missing sleep cannot be banked in advance — only partially recovered after the fact.',
    tip: 'The glymphatic system is your brain\'s nightly waste disposal. It clears the same toxic proteins that accumulate in Alzheimer\'s. This process requires deep sleep every night, not occasionally. Think of sleep like taking out the trash — the consequences of skipping compound slowly, invisibly, then suddenly.',
  },
  {
    id: 'light-management',
    emoji: '💡',
    name: 'Circadian Light Management',
    tagline: 'Bright light in the morning. Darkness at night. The highest-leverage free sleep intervention.',
    points: [
      'Morning sunlight within 60 minutes of waking sets the circadian master clock via melanopsin-expressing retinal cells — timing every hormone cycle, metabolic process, and sleep-wake signal for the next 24 hours.',
      'Evening blue light (phones, screens, LED overhead lighting) suppresses melatonin production for 2–3 hours after exposure. A single evening of screen use delays sleep onset by an average of 40–50 minutes.',
      'Indoor daytime lighting delivers 200–500 lux. Overcast outdoor light delivers 10,000+ lux. Windows block 50–90% of biologically active wavelengths — indoor substitutes are largely ineffective.',
      'Morning serotonin synthesis triggered by light converts to melatonin exactly 12–14 hours later — the same morning habit simultaneously improves daytime mood and nighttime sleep quality.',
    ],
    protocol: 'Step outside within 30–60 minutes of waking. Face toward the sky (never stare at the sun). Stay the full duration — through a window does not count. Sunny: 5–10 min. Overcast: 15–20 min. Heavy overcast or winter: 20–30 min. Evening: switch all lighting to warm amber/orange tones (2700K or lower) and avoid bright overhead lights and screens 90 minutes before bed.',
    tip: 'Dim your home lighting to "sunset level" 90 minutes before bed. The melanopsin cells in your retina are maximally sensitive to blue (480nm) wavelengths — warm orange/red lights contain almost none. A single phone screen in a dark room delays melatonin by 60+ minutes. This is the highest-leverage, zero-cost sleep environment change available.',
  },
  {
    id: 'temperature',
    emoji: '🌡️',
    name: 'Temperature & Sleep',
    tagline: 'Your core body temperature must drop 1–3°F to fall asleep — the room controls this.',
    points: [
      'Sleep onset is gated by a core body temperature drop of 1–3°F. This is a biological requirement, not a preference. Bedroom temperature directly controls how fast this drop occurs.',
      'A warm bath or shower (104°F / 40°C) taken 60–90 minutes before bed reduces average sleep onset time by 36% by drawing heat from core to periphery via skin vasodilation.',
      'Sleeping at 65–67°F (18–19°C) is associated with significantly more slow-wave sleep and fewer nighttime arousals compared to warmer rooms in temperature-controlled studies.',
      'Socks in bed paradoxically improve sleep onset: warming the feet dilates peripheral blood vessels, providing a thermal outlet for core heat dissipation and speeding the core cooling cascade.',
    ],
    protocol: 'Set the bedroom to 65–67°F (18–19°C). Use breathable, moisture-wicking sheets. Warm bath or shower protocol: 10 minutes at 104°F water, 90 minutes before bed. Dress cooler for bed — the body generates its own heat and needs room to offload it. Dress in layers you can remove rather than banking on ambient warmth.',
    tip: 'The warm bath before bed is one of the most replicated findings in sleep science — a 10-minute 104°F bath taken 90 minutes before bedtime reduces sleep onset by 36% (Haghayegh et al., 2019). It works not by relaxation but by physics: heating the skin draws core heat to the periphery, triggering the same thermoregulatory cascade your body uses naturally at dusk.',
  },
  {
    id: 'caffeine',
    emoji: '☕',
    name: 'Caffeine & the Adenosine System',
    tagline: 'Why your afternoon coffee is wrecking your deep sleep without you feeling it.',
    points: [
      'Caffeine has a 5–7 hour half-life. 400mg of coffee at 2pm leaves approximately 200mg still active at 9pm — directly suppressing deep sleep without you feeling "awake."',
      'Delaying caffeine 90 minutes after waking avoids competing with the natural cortisol awakening response. Taking caffeine immediately on waking blunts the cortisol pulse, increases dependence, and leads to a harder afternoon crash.',
      'Even when total sleep time is unchanged, afternoon caffeine measurably reduces slow-wave sleep depth and duration — you sleep the same hours but with less restorative deep sleep.',
      'Genetic CYP1A2 variation causes 3–4x variation in caffeine metabolism between individuals. "Slow metabolizers" see impaired sleep from caffeine consumed 8–9 hours earlier.',
    ],
    protocol: 'First caffeine: 90 minutes after waking — let the natural cortisol awakening response peak uninterrupted. Hard cutoff: 12pm (1pm maximum for fast metabolizers). Maximum: 400mg daily. For the afternoon energy dip: a 10–20 minute nap before 3pm restores alertness more effectively than caffeine without the sleep cost.',
    tip: 'Caffeine does not eliminate adenosine — it blocks its receptors temporarily. Adenosine accumulates behind the blockade the entire time caffeine is active. When caffeine wears off, all that accumulated adenosine hits at once — this is the crash. The only fix is sleep, not more caffeine. Each additional dose just delays the debt.',
  },
  {
    id: 'sleep-nutrition',
    emoji: '🫐',
    name: 'Sleep Nutrition & Magnesium',
    tagline: 'The deficiencies and foods that directly affect sleep architecture.',
    points: [
      'Magnesium deficiency — present in 50–68% of adults — directly impairs sleep by reducing GABA receptor sensitivity. GABA is the nervous system\'s primary inhibitory neurotransmitter required for sleep onset.',
      'Magnesium glycinate supplementation reduces cortisol, improves sleep onset time, and measurably increases sleep quality scores in randomized controlled trials in deficient adults.',
      'Alcohol suppresses REM sleep by 24% even in moderate amounts (1–2 drinks) — you may sleep 8 hours and feel unrested because the entire emotional-cognitive restoration window was cut off.',
      'High-glycemic meals within 2 hours of sleep are associated with more frequent nighttime awakenings via blood glucose fluctuations activating cortisol responses during the sleep period.',
    ],
    protocol: 'Magnesium glycinate: 200–400mg, 30–60 minutes before bed. Avoid magnesium oxide — only 4% is absorbed. No alcohol within 3 hours of bed. No large meals within 2 hours. Foods that support sleep: tart cherry juice (highest natural melatonin source), kiwi (2x nightly shown to reduce sleep onset by 35%), whole milk, eggs.',
    tip: 'Alcohol is the most underestimated sleep destroyer — even one drink at dinner measurably suppresses REM by 24%. You sleep the same hours but the second half (where dreams, emotional processing, and memory consolidation happen) is truncated. Sleep trackers make this visible immediately. The science is unambiguous regardless of how quickly you "fall asleep."',
  },
  {
    id: 'sleep-schedule',
    emoji: '⏰',
    name: 'Consistent Sleep Schedule',
    tagline: 'The most powerful single-variable intervention: same wake time, 7 days a week.',
    points: [
      'Sleep regularity — measured as consistency of timing — is independently predictive of all-cause mortality more than duration in large epidemiological cohorts. Irregular sleep timing carries metabolic and cardiovascular risk similar to shift work.',
      'The suprachiasmatic nucleus (master circadian clock) re-entrains completely after only 3–4 days of schedule shift. One "sleep-in" weekend sets the clock back, causing Monday fatigue that most people accept as normal.',
      'Sleep timing variability greater than ±45 minutes between weekdays and weekends doubles metabolic syndrome risk in prospective studies independent of total sleep duration.',
      'Consistency of wake time (not bedtime) is the primary lever. A fixed alarm anchors the adenosine timer, the cortisol curve, and the melatonin cascade from a single daily reference point.',
    ],
    protocol: 'Set one fixed wake time 7 days a week — including weekends and vacation. Build bedtime backwards from that target. If you fall short on sleep, use a 20-minute nap before 3pm as the recovery tool — not sleeping in. Bright light immediately on waking reinforces the anchor. Allow 3 weeks for the full circadian reset.',
    tip: 'Treating weekend sleep differently than weekday sleep — the near-universal "sleeping in Saturday and Sunday" pattern — is the root cause of Sunday night insomnia and Monday fatigue that most people experience chronically. The circadian clock cannot distinguish "earned" late sleep from disruption. Pick a wake time that works 7 days a week, not 5.',
  },
  {
    id: 'sleep-environment',
    emoji: '🛏️',
    name: 'Sleep Environment Optimization',
    tagline: 'Darkness, silence, and conditioning the bed-sleep association.',
    points: [
      'Even low-level light (hallway under the door, standby LEDs, street light through curtains) during sleep partially suppresses melatonin and fragments sleep architecture. A 2022 Northwestern study found a single dim light (40 lux — a nightlight) significantly increased insulin resistance and heart rate during sleep.',
      'Acoustic arousal — waking to sound — reduces dramatically with consistent masking noise (white, pink, or brown noise) because variability triggers arousals, not volume. A constant sound floor reduces the amplitude of noise spikes.',
      'Using the bedroom for work, TV, or phone use conditions the brain to associate the bed with alertness — the opposite of what\'s needed. The bed-sleep association must be strictly maintained.',
      'A dedicated pre-sleep routine (same sequence of 3–4 calming activities) acts as a conditioned cue that reliably shifts the nervous system toward parasympathetic state within 20–30 minutes of starting.',
    ],
    protocol: 'Light: 0 lux during sleep (blackout curtains or sleep mask, tape over standby LEDs). Sound: <35dB ambient or consistent masking noise. Temperature: 65–67°F. Devices: no screens visible during sleep. Routine: same 3–4 step sequence nightly, beginning 60 minutes before bed. Reserve the bed only for sleep — no working, reading stimulating content, or phone use in bed.',
    tip: 'Total darkness is not a comfort preference — it\'s a metabolic requirement. The 2022 PNAS study found that 40 lux of light during sleep (less than a nightlight) significantly increased insulin resistance and cortisol in healthy adults — the effect is real even through closed eyelids. Black electrical tape over LED indicators is free and takes 30 seconds.',
  },
];

const list = document.getElementById('cardList');
list.innerHTML = CARDS.map(c => `
  <div class="card" id="${c.id}">
    <div class="card-header" onclick="toggle('${c.id}')">
      <div class="card-icon">${c.emoji}</div>
      <div class="card-meta">
        <div class="card-name">${c.name}</div>
        <div class="card-tagline">${c.tagline}</div>
      </div>
      <span class="expand-arrow">▼</span>
    </div>
    <div class="card-body">
      <div class="card-inner">
        <div class="points">
          ${c.points.map((p,i) => `<div class="point"><div class="point-dot">${i+1}</div><span>${p}</span></div>`).join('')}
        </div>
        <div>
          <div class="sec-lbl">Protocol</div>
          <div class="protocol-box">${c.protocol}</div>
        </div>
        <div class="tip-box">
          <div class="tip-label">Pro Tip</div>
          ${c.tip}
        </div>
      </div>
    </div>
  </div>
`).join('');

function toggle(id) { document.getElementById(id).classList.toggle('open'); }
</script>
</body>
</html>
