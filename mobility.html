<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobility Guide — Daily Optimal Health</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --acc: #2dd46e; --glow: rgba(45,212,110,0.35);
      --bg1: #061a0c; --bg2: #0d4a24;
      --glass: rgba(255,255,255,0.07); --glass-b: rgba(255,255,255,0.13);
      --glass-h: rgba(255,255,255,0.12);
      --text: #f0fff4; --muted: rgba(240,255,244,0.55);
      --r: 14px; --r-sm: 10px; --amber: #f5a623;
    }
    html { min-height: 100%; scroll-behavior: smooth; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg1)); background-size: 400% 400%; animation: gradShift 18s ease infinite; color: var(--text); min-height: 100vh; overflow-x: hidden; }
    @keyframes gradShift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
    .top-bar { display: flex; align-items: center; gap: 12px; padding: 14px 24px; max-width: 860px; margin: 0 auto; border-bottom: 1px solid var(--glass-b); position: sticky; top: 0; z-index: 100; background: rgba(6,26,12,0.85); backdrop-filter: blur(16px); }
    .back-btn { color: var(--muted); font-size: .88rem; font-weight: 600; transition: color .2s; background: none; border: none; cursor: pointer; }
    .back-btn:hover { color: var(--acc); }
    .top-title { flex: 1; text-align: center; font-size: 1rem; font-weight: 800; text-shadow: 0 0 20px var(--glow); }
    .top-spacer { width: 60px; }
    .page { max-width: 860px; margin: 0 auto; padding: clamp(16px,4vw,28px) clamp(12px,3vw,20px) 100px; }
    .hero { text-align: center; padding: clamp(24px,5vw,40px) 0 clamp(20px,4vw,32px); }
    .hero-emoji { font-size: clamp(2.8rem,8vw,4.2rem); display: block; margin-bottom: 12px; filter: drop-shadow(0 0 18px var(--glow)); }
    .hero-title { font-size: clamp(1.7rem,5vw,2.8rem); font-weight: 900; letter-spacing: -1px; line-height: 1.1; background: linear-gradient(135deg, #fff 30%, var(--acc)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 10px; }
    .hero-sub { color: var(--muted); font-size: clamp(.85rem,2vw,1rem); max-width: 500px; margin: 0 auto; line-height: 1.65; }
    .card { background: var(--glass); border: 1px solid var(--glass-b); border-radius: var(--r); backdrop-filter: blur(12px); margin-bottom: 12px; overflow: hidden; scroll-margin-top: 72px; transition: border-color .2s; }
    .card.open { border-color: rgba(45,212,110,0.35); }
    .card-header { display: flex; align-items: center; gap: 14px; padding: clamp(14px,3vw,20px); cursor: pointer; transition: background .15s; user-select: none; }
    .card-header:hover { background: var(--glass-h); }
    .card-icon { font-size: clamp(1.8rem,4vw,2.4rem); flex-shrink: 0; width: clamp(48px,9vw,62px); height: clamp(48px,9vw,62px); background: rgba(45,212,110,0.1); border: 1px solid rgba(45,212,110,0.2); border-radius: 14px; display: flex; align-items: center; justify-content: center; }
    .card-meta { flex: 1; min-width: 0; }
    .card-name { font-size: clamp(.98rem,2.6vw,1.18rem); font-weight: 900; margin-bottom: 3px; }
    .card-tagline { color: var(--muted); font-size: .8rem; }
    .expand-arrow { color: var(--muted); font-size: .8rem; transition: transform .25s; flex-shrink: 0; }
    .card.open .expand-arrow { transform: rotate(180deg); }
    .card-body { max-height: 0; overflow: hidden; transition: max-height .4s cubic-bezier(.4,0,.2,1); border-top: 1px solid transparent; }
    .card.open .card-body { max-height: 2000px; border-top-color: var(--glass-b); }
    .card-inner { padding: clamp(16px,3vw,24px); display: flex; flex-direction: column; gap: 16px; }
    .points { display: flex; flex-direction: column; gap: 10px; }
    .point { display: flex; gap: 11px; align-items: flex-start; font-size: .85rem; line-height: 1.6; }
    .point-dot { width: 20px; height: 20px; border-radius: 50%; background: rgba(45,212,110,0.18); color: var(--acc); font-size: .72rem; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
    .sec-lbl { font-size: .66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 9px; display: flex; align-items: center; gap: 8px; }
    .sec-lbl::after { content:''; flex:1; height:1px; background: var(--glass-b); }
    .protocol-box { background: rgba(255,255,255,0.04); border: 1px solid var(--glass-b); border-radius: var(--r-sm); padding: 14px; font-size: .83rem; line-height: 1.65; color: rgba(240,255,244,0.85); }
    .tip-box { background: rgba(245,166,35,0.07); border: 1px solid rgba(245,166,35,0.25); border-radius: var(--r-sm); padding: 12px 15px; font-size: .81rem; line-height: 1.65; }
    .tip-label { color: var(--amber); font-weight: 800; font-size: .68rem; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 4px; }
  </style>
  <script src="health-notifications.js" defer></script>
</head>
<body>
<div class="top-bar">
  <button class="back-btn" onclick="history.back()">← Back</button>
  <div class="top-title">🤸 Mobility Guide</div>
  <div class="top-spacer"></div>
</div>
<div class="page">
  <div class="hero">
    <span class="hero-emoji">🦵</span>
    <div class="hero-title">Mobility & Flexibility Guide</div>
    <div class="hero-sub">Pain-free movement, better posture, and injury prevention. These practices fix root causes — not just symptoms — of the stiffness and pain that come from modern sedentary life.</div>
  </div>
  <div id="cardList"></div>
</div>
<script>
const CARDS = [
  {
    id: 'dynamic-warmup',
    emoji: '🏃',
    name: 'Dynamic Warm-Up',
    tagline: 'Move to become mobile — the right way to prepare joints and muscles for exercise',
    points: [
      'Dynamic movements through full range of motion (leg swings, hip circles, inchworms) increase synovial fluid production in joints — this viscous fluid is the joint\'s lubricant. Cold, static joints have less of it, making movement stiffer and higher-risk.',
      'Static stretching before exercise reduces power output by 5–8% in the subsequent session — a consistent finding in sports science. Dynamic movement is the pre-exercise standard and does not carry this penalty.',
      'Moving joints through their range of motion before loading prepares the musculotendinous unit for the force demands of exercise — reducing the mechanical mismatch that causes acute strains and sprains.',
      'Even 5–10 minutes of targeted dynamic movement increases core body temperature by 1–2°F — the optimal range for contractile muscle efficiency and neural conduction speed.',
    ],
    protocol: '5–10 minutes, immediately before every training session. Start with general movement (walking, light jumping jacks) for 60–90 seconds, then move to targeted dynamic exercises. 8–12 reps of each movement, not held. Mimic the planes and patterns of the upcoming session. Key movements: world\'s greatest stretch, leg swings, hip circles, arm circles, inchworms, thoracic rotations.',
    tip: 'Static stretching before lifting reduces power output by 5–8% — consistent across the sports science literature. This doesn\'t mean static stretching is bad; it means it belongs after training, not before. Dynamic movement is the pre-exercise standard. Save your hamstring stretches for the post-workout cool-down when muscles are warm and pliable.',
  },
  {
    id: 'static-stretching',
    emoji: '🧘',
    name: 'Static Stretching',
    tagline: 'Daily low-intensity holds — the only way to actually add muscle length',
    points: [
      'Daily static stretching adds sarcomeres in series — genuine structural muscle lengthening, not just improved neural tolerance. Confirmed by ultrasound measures of fascicle length increase.',
      '30-second holds are the minimum effective stimulus for flexibility adaptation — holds shorter than 15 seconds show no lasting range of motion improvement. 30–60 seconds is the evidence-backed sweet spot per stretch.',
      'Evening flexibility work doubles as stress reduction — passive static stretching activates the parasympathetic nervous system and measurably reduces cortisol, making it one of the most effective bedtime wind-down practices that also produces physical adaptation.',
      'Regular hip flexor, hamstring, and thoracic stretching directly reduces lower back pain in sedentary adults — addressing the shortened muscles that pull the spine out of neutral alignment every hour of sitting.',
    ],
    protocol: 'After exercise or in the evening when muscles are warm. Hold each stretch 30–60 seconds, 2–3 sets per muscle group. Breathe throughout — exhale into the stretch, don\'t force. Go to mild discomfort, not pain. Daily practice produces faster gains than 3x/week. Key areas: hip flexors (couch stretch), hamstrings (forward fold), chest/shoulders, thoracic, calves.',
    tip: 'Flexibility is not gained by stretching harder — it\'s gained by stretching more consistently at lower intensity. The stretch reflex fires when stretch is too aggressive or too fast, causing the muscle to contract and resist. Daily gentle holds progressively teach the nervous system that the range is safe. One aggressive session per week fights the reflex. Daily gentle exposure educates it.',
  },
  {
    id: 'foam-rolling',
    emoji: '🪵',
    name: 'Foam Rolling',
    tagline: 'Neurological muscle release — not tissue breakup, but targeted inhibitory signaling',
    points: [
      'Reduces delayed onset muscle soreness (DOMS) by 30% when used systematically after resistance training — the most consistently replicated sports recovery finding across meta-analyses.',
      'Increases range of motion before exercise more effectively than static stretching without the power output reduction — making it the preferred pre-exercise mobility tool.',
      'The mechanism is neurological, not mechanical: sustained pressure activates the Golgi tendon organ (GTO), which sends an inhibitory signal to the alpha motor neurons, causing the muscle to relax and lengthen — not "break up fascia."',
      'Stimulates parasympathetic response via skin mechanoreceptors — slow, sustained foam rolling is measurably calming, explaining why it\'s used in pre-competition anxiety management protocols.',
    ],
    protocol: 'Roll slowly — 1 inch per second maximum. When you find a tender or tight spot, stop and hold for 20–30 seconds rather than rolling back and forth aggressively. The hold is where the GTO inhibition happens. Aggressive rolling stimulates the stretch reflex and increases muscle tone — the opposite of the goal. Target: calves, IT band, thoracic spine, hip flexors, glutes, lats. Pre-workout: 5–8 min. Post-workout: 5–10 min.',
    tip: 'The foam roller doesn\'t "break up fascia." Fascia is dense connective tissue — it takes forces measured in hundreds of pounds to mechanically deform it, not a foam cylinder. The entire benefit is neurological: the Golgi tendon organ senses sustained tension and sends an inhibitory signal causing the muscle to relax. Hold the pressure point still instead of rolling aggressively to maximize GTO stimulation.',
  },
  {
    id: 'hip-flexors',
    emoji: '🦴',
    name: 'Hip Flexor Health',
    tagline: 'The most neglected muscle group in modern life — the root cause of most lower back pain',
    points: [
      'The psoas major attaches directly to the lumbar vertebrae (L1–L5). Chronically shortened hip flexors physically pull the lumbar spine into exaggerated lordosis, compressing the posterior disc space and facet joints — the anatomical root cause of most lower back pain in desk workers.',
      'Sitting for 6+ hours per day progressively shortens the hip flexors over months — not a flexibility issue, but structural adaptation. The muscle literally loses sarcomeres in the held shortened position.',
      'Tight hip flexors inhibit the gluteus maximus via reciprocal inhibition — weak, inhibited glutes force the hamstrings and lower back to compensate during hip extension, driving overuse injury at these compensatory sites.',
      'Couch stretch (90-second holds, twice daily) produces measurable hip flexor length increase and lower back pain reduction in as little as 4 weeks of consistent practice.',
    ],
    protocol: 'Couch stretch: kneel facing away from a wall, place the back knee against the wall (shin up the wall), step front foot forward until the back hip drops. Squeeze the glute of the back leg — this is the key cue. Hold 90 seconds each side, 2x daily (morning and evening). This stretch is the most effective hip flexor stretch available because the posterior pelvic tilt it requires creates maximum tissue stretch. 30 days for significant structural change.',
    tip: 'Two couch stretches per day (90 seconds each side) will likely eliminate chronic lower back pain within 30 days for most desk workers — not because the lower back is the problem, but because the hip flexors pulling the lumbar spine forward IS the problem. The couch stretch is uncomfortable in the first week and progressively more comfortable as length is restored. Stick through the first week.',
  },
  {
    id: 'thoracic-mobility',
    emoji: '🫀',
    name: 'Thoracic Spine Mobility',
    tagline: 'The key to posture, shoulder health, breathing capacity, and neck pain relief',
    points: [
      'Loss of thoracic extension (kyphotic "phone posture") cascades up the chain: the shoulder cannot fully elevate, the neck is forced into chronic forward flexion, and sub-occipital headaches become chronic.',
      'Full overhead shoulder range of motion requires ~10 degrees of thoracic extension — individuals with kyphotic spines cannot raise the arm to full overhead without compensating through lumbar extension.',
      'Reduced thoracic rotation limits rotational sports performance (golf, tennis, swimming) — the thorax supplies the majority of rotational range; when restricted, the hip and cervical spine compensate, creating injury cascades.',
      'Improving thoracic extension measurably reduces shoulder impingement symptoms in 4–6 weeks in adults with desk-induced kyphosis — without any direct treatment to the shoulder itself.',
    ],
    protocol: 'Foam roller thoracic extension: place the roller horizontally across the mid-back (not lower back), arms crossed or behind head, and extend over the roller. Hold 30–60 seconds and move one vertebral segment at a time (T4–T8). 5–8 minutes daily. Thoracic rotation: 10 reps each direction in seated or quadruped (thread-the-needle). Cat-cow: 10 full cycles before any upper body session.',
    tip: 'Shoulder pain during bench press or overhead press is frequently diagnosed as a rotator cuff or impingement problem when it\'s actually a thoracic restriction. You cannot raise the arm to full overhead range if the thoracic spine is kyphotic — the scapular mechanics that enable overhead motion depend on thoracic extension. Address thoracic mobility for 4 weeks before assuming the shoulder itself is the problem.',
  },
  {
    id: 'loaded-stretching',
    emoji: '🏋️',
    name: 'Loaded Stretching',
    tagline: 'The research-backed path to permanent flexibility gains — strength at end range',
    points: [
      'Loaded stretching (strengthening through full range of motion to end range) adds sarcomeres in series at 40–50% greater magnitude per unit of time than passive static stretching.',
      'Produces simultaneous flexibility and strength at the newly acquired range — unlike passive stretching which only builds neural tolerance, loaded stretching builds structural tissue capacity at the lengthened position.',
      'Romanian deadlifts, ATG split squats, and Nordic curls have all demonstrated significant fascicle length increases (genuine muscle lengthening confirmed by ultrasound) after 6–8 week training blocks.',
      'End-range strength is the injury-prevention goal that flexibility alone cannot achieve — a joint that is hypermobile but weak at end range is more injury-prone than a stiff joint. Loaded stretching addresses both simultaneously.',
    ],
    protocol: '2–3 sessions per week as part of lower body training. Romanian deadlift (hamstrings): slow 3–4 second eccentric, full hip hinge to end range, 3 sets of 8–10. ATG split squat (hip flexors + quads): front shin vertical, back knee approaching floor, 3 sets of 8 each side. Nordic curl (hamstring eccentric): 3 sets of 5–8. Progress load conservatively — end range is the highest tissue-stress position.',
    tip: 'Static stretching produces flexibility by improving the nervous system\'s tolerance to a lengthened position. Loaded stretching produces flexibility by adding actual structural length (sarcomeres in series). For permanent, lasting changes in joint range of motion that carry into sport or movement — loaded stretching is the mechanism that achieves it. Static stretching is the warmup. Loaded stretching is the training.',
  },
  {
    id: 'ankle-mobility',
    emoji: '🦶',
    name: 'Ankle Mobility',
    tagline: 'Restricted ankles are the root cause of knee pain, hip compensation, and poor squat mechanics',
    points: [
      'Limited ankle dorsiflexion is the most common root cause of heel rise in the squat, valgus knee collapse, hip compensations, and chronic knee pain — fixing the ankle resolves these downstream problems without direct intervention at the knee or hip.',
      'Every step, squat, lunge, and jump requires adequate ankle dorsiflexion — restricted ankles force the body to compensate through tibial internal rotation, knee valgus, and hip internal rotation on every single rep throughout the day.',
      'Achilles tendon stiffness reduces the tendon\'s elastic energy storage capacity — the spring-like recoil mechanism that returns energy during gait. Tight Achilles tendons increase the metabolic cost of walking and running by measurable amounts.',
      'A 5-degree improvement in ankle dorsiflexion allows the knee to track properly over the foot during squatting, significantly reducing patellofemoral compression and anterior knee pain.',
    ],
    protocol: 'Knee-to-wall test: stand 3–4 inches from a wall, feet straight. Touch your knee to the wall without lifting the heel. Fail? Your dorsiflexion is limiting your movement. Wall ankle stretch: stand 2–3 inches from the wall, drive knee toward wall while keeping heel flat. 3 sets of 30 seconds per side, daily. Standing calf raises with full heel drop (Achilles lengthening): 3 sets of 15–20. Progress the knee-to-wall distance over 4–6 weeks.',
    tip: 'Stand with your big toe 4 inches from the wall and try to touch your knee to the wall without your heel coming up. Fail the test? Every squat rep, every step, every lunge is being compensated through your knee and hip. Daily ankle work for 30 days moves the wall distance significantly. Measure it before and after — it\'s a simple, objective progress marker.',
  },
];

const list = document.getElementById('cardList');
list.innerHTML = CARDS.map(c => `
  <div class="card" id="${c.id}">
    <div class="card-header" onclick="toggle('${c.id}')">
      <div class="card-icon">${c.emoji}</div>
      <div class="card-meta">
        <div class="card-name">${c.name}</div>
        <div class="card-tagline">${c.tagline}</div>
      </div>
      <span class="expand-arrow">▼</span>
    </div>
    <div class="card-body">
      <div class="card-inner">
        <div class="points">
          ${c.points.map((p,i) => `<div class="point"><div class="point-dot">${i+1}</div><span>${p}</span></div>`).join('')}
        </div>
        <div>
          <div class="sec-lbl">Protocol</div>
          <div class="protocol-box">${c.protocol}</div>
        </div>
        <div class="tip-box">
          <div class="tip-label">Pro Tip</div>
          ${c.tip}
        </div>
      </div>
    </div>
  </div>
`).join('');

function toggle(id) { document.getElementById(id).classList.toggle('open'); }
</script>
</body>
</html>
