<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Builder — Daily Optimal Health</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --acc: #2dd46e; --glow: rgba(45,212,110,0.35);
      --bg1: #061a0c; --bg2: #0d4a24;
      --glass: rgba(255,255,255,0.07); --glass-b: rgba(255,255,255,0.13);
      --glass-h: rgba(255,255,255,0.12);
      --text: #f0fff4; --muted: rgba(240,255,244,0.55);
      --r: 14px; --r-sm: 10px; --amber: #f5a623;
    }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg1));
      background-size: 400% 400%; animation: gradShift 18s ease infinite;
      color: var(--text); min-height: 100vh; overflow-x: hidden;
    }
    @keyframes gradShift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }

    .top-bar {
      display:flex; align-items:center; gap:12px;
      padding:14px 24px; max-width:960px; margin:0 auto;
      border-bottom:1px solid var(--glass-b);
      position:sticky; top:0; z-index:100;
      background:rgba(6,26,12,0.9); backdrop-filter:blur(16px);
    }
    .back-btn { color:var(--muted); font-size:.88rem; font-weight:600; background:none; border:none; cursor:pointer; transition:color .2s; }
    .back-btn:hover { color:var(--acc); }
    .top-title { flex:1; text-align:center; font-size:1rem; font-weight:800; text-shadow:0 0 20px var(--glow); }

    .tabs {
      display:flex; max-width:960px; margin:0 auto;
      border-bottom:1px solid var(--glass-b);
      background:rgba(6,26,12,0.8); position:sticky; top:53px; z-index:99;
    }
    .tab-btn {
      flex:1; padding:13px 0; font-size:.82rem; font-weight:700;
      background:none; border:none; cursor:pointer; color:var(--muted);
      border-bottom:2px solid transparent; transition:all .2s;
    }
    .tab-btn.active { color:var(--acc); border-bottom-color:var(--acc); }
    .tab-btn:hover:not(.active) { color:var(--text); }

    .page { max-width:960px; margin:0 auto; padding:clamp(16px,4vw,28px) clamp(12px,3vw,20px) 120px; }
    .view { display:none; }
    .view.active { display:block; }

    /* CARDS */
    .card {
      background:var(--glass); border:1px solid var(--glass-b);
      border-radius:var(--r); backdrop-filter:blur(12px); margin-bottom:12px; overflow:hidden;
    }
    .card.open { border-color:rgba(45,212,110,.3); }
    .card-header {
      display:flex; align-items:center; gap:12px;
      padding:16px 18px; cursor:pointer; transition:background .15s; user-select:none;
    }
    .card-header:hover { background:var(--glass-h); }
    .card-body { max-height:0; overflow:hidden; transition:max-height .45s cubic-bezier(.4,0,.2,1); border-top:1px solid transparent; }
    .card.open .card-body { max-height:5000px; border-top-color:var(--glass-b); }
    .expand-arrow { color:var(--muted); font-size:.8rem; transition:transform .25s; margin-left:auto; flex-shrink:0; }
    .card.open .expand-arrow { transform:rotate(180deg); }

    /* BUTTONS */
    .btn { padding:9px 18px; border-radius:8px; border:none; cursor:pointer; font-size:.85rem; font-weight:700; transition:all .2s; }
    .btn-primary { background:var(--acc); color:#061a0c; }
    .btn-primary:hover { filter:brightness(1.1); }
    .btn-ghost { background:rgba(255,255,255,0.07); border:1px solid var(--glass-b); color:var(--text); }
    .btn-ghost:hover { background:var(--glass-h); }
    .btn-danger { background:rgba(255,77,77,0.15); border:1px solid rgba(255,77,77,.3); color:#ff7070; }
    .btn-danger:hover { background:rgba(255,77,77,.25); }
    .btn-sm { padding:5px 12px; font-size:.78rem; }
    .btn-amber { background:rgba(245,166,35,.18); border:1px solid rgba(245,166,35,.35); color:var(--amber); }
    .btn-amber:hover { background:rgba(245,166,35,.28); }

    /* INPUTS */
    .input {
      background:rgba(255,255,255,0.06); border:1px solid var(--glass-b);
      border-radius:8px; padding:9px 13px; color:var(--text);
      font-size:.88rem; width:100%; outline:none; transition:border .2s;
    }
    .input:focus { border-color:var(--acc); }
    .input::placeholder { color:var(--muted); }
    label { font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); display:block; margin-bottom:5px; }

    .sec-lbl {
      font-size:.66rem; font-weight:800; text-transform:uppercase; letter-spacing:1.2px;
      color:var(--muted); margin-bottom:9px; display:flex; align-items:center; gap:8px;
    }
    .sec-lbl::after { content:''; flex:1; height:1px; background:var(--glass-b); }

    .row { display:flex; align-items:center; gap:10px; }
    .mt8 { margin-top:8px; } .mt16 { margin-top:16px; }
    .mb8 { margin-bottom:8px; } .mb16 { margin-bottom:16px; }

    /* BUILDER LAYOUT */
    .builder-layout { display:flex; gap:16px; align-items:flex-start; }
    .sidebar { width:210px; flex-shrink:0; }
    .main-panel { flex:1; min-width:0; }
    @media(max-width:620px){ .builder-layout{flex-direction:column} .sidebar{width:100%} }

    .routine-item {
      padding:11px 13px; border-radius:10px; cursor:pointer; margin-bottom:6px;
      background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
      display:flex; align-items:center; gap:8px; transition:all .2s;
    }
    .routine-item.sel { background:rgba(45,212,110,.15); border-color:rgba(45,212,110,.4); }
    .routine-item-name { flex:1; font-weight:700; font-size:.88rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .routine-item-meta { color:var(--muted); font-size:.72rem; flex-shrink:0; }

    /* ICON BUTTONS */
    .icon-btn { background:none; border:none; cursor:pointer; padding:3px 5px; font-size:.82rem; color:var(--muted); transition:color .15s; flex-shrink:0; }
    .icon-btn:hover { color:var(--acc); }
    .icon-btn.del:hover { color:#ff7070; }

    /* MUSCLE CHIPS */
    .muscle-chips { display:flex; flex-wrap:wrap; gap:6px; }
    .muscle-chip {
      padding:4px 10px; border-radius:20px; font-size:.73rem; font-weight:700;
      cursor:pointer; background:rgba(255,255,255,0.07); border:1px solid var(--glass-b);
      color:var(--muted); transition:all .2s; user-select:none;
    }
    .muscle-chip.sel { background:rgba(45,212,110,.18); border-color:rgba(45,212,110,.5); color:var(--acc); }

    /* EXERCISE ROWS */
    .ex-row {
      display:flex; align-items:center; gap:10px; padding:11px 16px;
      border-bottom:1px solid rgba(255,255,255,0.05);
    }
    .ex-row:last-child { border-bottom:none; }
    .ex-name { font-weight:700; font-size:.9rem; flex:1; }
    .ex-meta { color:var(--muted); font-size:.75rem; }

    /* SESSION */
    .session-ex { background:var(--glass); border:1px solid var(--glass-b); border-radius:var(--r); margin-bottom:12px; overflow:hidden; }
    .session-ex-header { padding:13px 17px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--glass-b); }
    .session-ex-name { font-weight:900; font-size:.95rem; flex:1; }
    .session-ex-target { color:var(--muted); font-size:.75rem; }
    .set-row { display:flex; align-items:center; gap:10px; padding:9px 17px; border-bottom:1px solid rgba(255,255,255,0.04); }
    .set-row:last-child { border-bottom:none; }
    .set-num { color:var(--muted); font-size:.75rem; font-weight:800; width:28px; flex-shrink:0; }
    .set-input {
      background:rgba(255,255,255,0.06); border:1px solid var(--glass-b);
      border-radius:8px; padding:7px 8px; color:var(--text);
      font-size:.85rem; width:68px; text-align:center; outline:none; transition:border .2s;
    }
    .set-input:focus { border-color:var(--acc); }
    .set-sep { color:var(--muted); font-size:.78rem; }
    .set-check {
      width:28px; height:28px; border-radius:50%; border:2px solid var(--glass-b);
      background:none; cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:all .2s; flex-shrink:0; margin-left:auto; font-size:.8rem;
    }
    .set-check.done { background:var(--acc); border-color:var(--acc); color:#061a0c; font-weight:900; }

    /* TIMER BAR */
    .timer-bar {
      background:rgba(6,26,12,0.95); backdrop-filter:blur(16px);
      border-top:1px solid var(--glass-b); padding:10px 20px;
      display:none; align-items:center; gap:14px;
      position:fixed; bottom:0; left:0; right:0; z-index:200;
    }
    .timer-display { font-size:1.35rem; font-weight:900; letter-spacing:2px; color:var(--acc); }
    .timer-label { color:var(--muted); font-size:.65rem; font-weight:800; text-transform:uppercase; letter-spacing:.8px; margin-bottom:1px; }
    .timer-divider { width:1px; height:36px; background:var(--glass-b); flex-shrink:0; }
    .rest-display { font-size:1.35rem; font-weight:900; letter-spacing:2px; color:var(--acc); transition:color .2s; }
    .rest-display.urgent { color:#ff7070; animation:restPulse .7s ease infinite; }
    @keyframes restPulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .rest-dur-btn {
      padding:4px 8px; border-radius:6px; font-size:.7rem; font-weight:700;
      background:rgba(255,255,255,0.06); border:1px solid var(--glass-b);
      color:var(--muted); cursor:pointer; transition:all .15s;
    }
    .rest-dur-btn.sel { background:rgba(45,212,110,.2); border-color:rgba(45,212,110,.4); color:var(--acc); }

    /* EXERCISE SUGGESTIONS */
    .suggest-wrap { position:relative; }
    .suggest-list {
      position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:700;
      background:#0b2616; border:1px solid rgba(45,212,110,.25);
      border-radius:9px; list-style:none;
      max-height:210px; overflow-y:auto;
      box-shadow:0 10px 32px rgba(0,0,0,0.6);
      display:none;
    }
    .suggest-item {
      padding:9px 13px; font-size:.85rem; cursor:pointer;
      border-bottom:1px solid rgba(255,255,255,0.04); transition:background .1s;
    }
    .suggest-item:last-child { border-bottom:none; }
    .suggest-item:hover, .suggest-item.muscle-match { background:rgba(45,212,110,.08); }
    .suggest-item.muscle-match { color:var(--acc); }
    .suggest-item.muscle-match::after { content:' ✦'; font-size:.65rem; opacity:.6; }

    /* PRESETS */
    .preset-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
    .preset-card {
      background:var(--glass); border:1px solid var(--glass-b);
      border-radius:var(--r); overflow:hidden; transition:border-color .2s;
    }
    .preset-card:hover { border-color:rgba(45,212,110,.3); }
    .preset-card-header {
      padding:18px; cursor:pointer; display:flex; gap:14px; align-items:flex-start;
      transition:background .15s;
    }
    .preset-card-header:hover { background:var(--glass-h); }
    .preset-icon {
      font-size:1.8rem; width:52px; height:52px; flex-shrink:0;
      background:rgba(45,212,110,.1); border:1px solid rgba(45,212,110,.2);
      border-radius:12px; display:flex; align-items:center; justify-content:center;
    }
    .preset-info { flex:1; min-width:0; }
    .preset-name { font-size:1rem; font-weight:900; margin-bottom:4px; }
    .preset-tagline { color:var(--muted); font-size:.78rem; line-height:1.5; }
    .preset-badges { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
    .badge {
      padding:3px 9px; border-radius:20px; font-size:.68rem; font-weight:700;
      background:rgba(255,255,255,0.08); border:1px solid var(--glass-b); color:var(--muted);
    }
    .badge-green { background:rgba(45,212,110,.12); border-color:rgba(45,212,110,.3); color:var(--acc); }
    .preset-body { display:none; border-top:1px solid var(--glass-b); padding:16px; }
    .preset-card.open .preset-body { display:block; }
    .preset-day-row {
      display:flex; align-items:center; gap:10px; padding:8px 0;
      border-bottom:1px solid rgba(255,255,255,0.04); font-size:.83rem;
    }
    .preset-day-row:last-child { border-bottom:none; }
    .preset-day-name { font-weight:700; min-width:120px; }
    .preset-day-exs { color:var(--muted); font-size:.75rem; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .preset-add-btn {
      width:100%; margin-top:14px; padding:11px;
      background:var(--acc); color:#061a0c; border:none; border-radius:10px;
      font-weight:900; font-size:.9rem; cursor:pointer; transition:filter .2s;
    }
    .preset-add-btn:hover { filter:brightness(1.1); }
    .preset-add-btn.added { background:rgba(45,212,110,.2); color:var(--acc); border:1px solid rgba(45,212,110,.4); cursor:default; }

    /* HISTORY */
    .hist-date-label { color:var(--muted); font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.8px; margin:20px 0 8px; }
    .hist-item { background:var(--glass); border:1px solid var(--glass-b); border-radius:var(--r); padding:15px 17px; margin-bottom:8px; }
    .hist-title { font-weight:900; font-size:.95rem; margin-bottom:3px; }
    .hist-meta { color:var(--muted); font-size:.75rem; margin-bottom:10px; }
    .hist-chips { display:flex; flex-wrap:wrap; gap:6px; }
    .hist-chip {
      background:rgba(45,212,110,.1); border:1px solid rgba(45,212,110,.2);
      border-radius:6px; padding:3px 8px; font-size:.72rem; color:var(--acc);
    }

    /* EMPTY */
    .empty { text-align:center; padding:48px 24px; color:var(--muted); }
    .empty-icon { font-size:3rem; margin-bottom:12px; display:block; }
    .empty-text { font-size:.88rem; line-height:1.65; }

    /* MODAL */
    .modal-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,0.75); backdrop-filter:blur(6px);
      z-index:500; display:none; align-items:center; justify-content:center; padding:20px;
    }
    .modal-overlay.open { display:flex; }
    .modal {
      background:#0b2616; border:1px solid var(--glass-b); border-radius:var(--r);
      padding:24px; width:100%; max-width:500px; max-height:90vh; overflow-y:auto;
    }
    .modal-title { font-size:1.1rem; font-weight:900; margin-bottom:18px; }
    .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
    .form-group { display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
    .form-group:last-child { margin-bottom:0; }
    .form-row { display:flex; gap:10px; }
    .form-row .form-group { flex:1; }

    /* BODY SVG */
    .body-wrap { display:flex; gap:14px; flex-wrap:wrap; }
    .body-figure { text-align:center; }
    .body-label { color:var(--muted); font-size:.62rem; font-weight:800; text-transform:uppercase; letter-spacing:.8px; margin-bottom:4px; }

    /* TOAST */
    #wb-toast {
      position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
      background:var(--acc); color:#061a0c; font-weight:800; font-size:.85rem;
      padding:10px 22px; border-radius:10px; z-index:400;
      opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <button class="back-btn" onclick="history.back()">← Back</button>
  <div class="top-title">🏋️ Workout Builder</div>
  <a href="workout-templates.html" style="color:var(--muted);font-size:.78rem;font-weight:700;text-decoration:none;white-space:nowrap;transition:color .2s" onmouseover="this.style.color='var(--acc)'" onmouseout="this.style.color='var(--muted)'">Programs →</a>
</div>

<div class="tabs">
  <button class="tab-btn active" id="tab-builder"  onclick="switchTab('builder')">📋 Build</button>
  <button class="tab-btn"        id="tab-presets"  onclick="switchTab('presets')">⭐ Presets</button>
  <button class="tab-btn"        id="tab-train"    onclick="switchTab('train')">⚡ Train</button>
  <button class="tab-btn"        id="tab-history"  onclick="switchTab('history')">📊 History</button>
</div>

<div class="page">
  <div id="view-builder"  class="view active"></div>
  <div id="view-presets"  class="view"></div>
  <div id="view-train"    class="view"></div>
  <div id="view-history"  class="view"></div>
</div>

<!-- Modals -->
<div id="modal-routine" class="modal-overlay">
  <div class="modal">
    <div class="modal-title" id="modal-routine-title">New Routine</div>
    <div class="form-group">
      <label>Routine Name</label>
      <input class="input" id="input-routine-name" placeholder="e.g. Push Pull Legs">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-routine')">Cancel</button>
      <button class="btn btn-primary" onclick="saveRoutine()">Save</button>
    </div>
  </div>
</div>

<div id="modal-day" class="modal-overlay">
  <div class="modal">
    <div class="modal-title" id="modal-day-title">New Training Day</div>
    <div class="form-group">
      <label>Day Name</label>
      <input class="input" id="input-day-name" placeholder="e.g. Push Day, Chest & Tris">
    </div>
    <div class="sec-lbl" style="margin-top:16px">Target Muscle Groups</div>
    <div class="body-wrap mb16" id="modal-body-wrap"></div>
    <div class="muscle-chips" id="modal-muscle-chips"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-day')">Cancel</button>
      <button class="btn btn-primary" onclick="saveDay()">Save</button>
    </div>
  </div>
</div>

<div id="modal-exercise" class="modal-overlay">
  <div class="modal">
    <div class="modal-title" id="modal-ex-title">Add Exercise</div>
    <div id="ex-muscle-hint" style="display:none;margin-bottom:12px;font-size:.75rem;color:var(--acc);font-weight:700"></div>
    <div class="form-group">
      <label>Exercise Name</label>
      <div class="suggest-wrap">
        <input class="input" id="input-ex-name" placeholder="e.g. Bench Press"
          oninput="showSuggest(this.value)"
          onblur="setTimeout(hideSuggest, 150)"
          autocomplete="off">
        <ul class="suggest-list" id="ex-suggest"></ul>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Sets</label>
        <input class="input" id="input-ex-sets" type="number" min="1" max="20" placeholder="3">
      </div>
      <div class="form-group">
        <label>Reps</label>
        <input class="input" id="input-ex-reps" placeholder="8-12">
      </div>
      <div class="form-group">
        <label>Weight (lbs)</label>
        <input class="input" id="input-ex-weight" type="number" min="0" placeholder="0">
      </div>
    </div>
    <div class="form-group" style="margin-top:4px">
      <label>Notes (optional)</label>
      <input class="input" id="input-ex-notes" placeholder="e.g. 2s eccentric, squeeze at top">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-exercise')">Cancel</button>
      <button class="btn btn-primary" onclick="saveExercise()">Save</button>
    </div>
  </div>
</div>

<!-- Timer Bar -->
<div id="timer-bar" class="timer-bar">
  <div>
    <div class="timer-label">Session</div>
    <div class="timer-display" id="timer-display">00:00</div>
  </div>
  <div id="rest-main" style="display:none;border-left:1px solid var(--glass-b);padding-left:14px;margin-left:2px">
    <div class="timer-label" id="rest-label">Rest</div>
    <div class="rest-display" id="rest-display">1:30</div>
  </div>
  <div style="flex:1"></div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
    <div style="display:flex;gap:4px" id="rest-dur-btns"></div>
    <div style="display:flex;gap:6px">
      <button id="skip-rest-btn" class="btn btn-ghost btn-sm" onclick="skipRest()" style="display:none">Skip Rest</button>
      <button class="btn btn-danger btn-sm" onclick="finishSession()">Finish ✓</button>
    </div>
  </div>
</div>

<div id="wb-toast"></div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const LS_R = 'wob_routines';
const LS_S = 'wob_sessions';

const MUSCLES = [
  { id:'chest',      label:'Chest',       col:'#ff6b6b', front:true  },
  { id:'shoulders',  label:'Shoulders',   col:'#ffa94d', front:true  },
  { id:'biceps',     label:'Biceps',      col:'#74c0fc', front:true  },
  { id:'forearms',   label:'Forearms',    col:'#63e6be', front:true  },
  { id:'abs',        label:'Abs',         col:'#ffd43b', front:true  },
  { id:'obliques',   label:'Obliques',    col:'#ff9f43', front:true  },
  { id:'quads',      label:'Quads',       col:'#4dabf7', front:true  },
  { id:'calves',     label:'Calves',      col:'#69db7c', front:true  },
  { id:'traps',      label:'Traps',       col:'#da77f2', front:false },
  { id:'lats',       label:'Lats',        col:'#3bc9db', front:false },
  { id:'upper-back', label:'Upper Back',  col:'#f783ac', front:false },
  { id:'lower-back', label:'Lower Back',  col:'#a9e34b', front:false },

// ── TOAST ─────────────────────────────────────────────────────────────────────
function showToast(msg, duration=2800) {
  const t = document.getElementById('wb-toast');
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._t);
  t._t = setTimeout(() => t.style.opacity = '0', duration);
}

// ── REST TIMER ────────────────────────────────────────────────────────────────
const REST_OPTS = [{d:60,label:'1m'},{d:90,label:'90s'},{d:120,label:'2m'},{d:180,label:'3m'}];
let restDur=90, restSecs=0, restTimer=null;

function initRestBtns() {
  const wrap = document.getElementById('rest-dur-btns');
  REST_OPTS.forEach(o => {
    const b = document.createElement('button');
    b.className = 'rest-dur-btn' + (o.d===restDur?' sel':'');
    b.dataset.d = o.d; b.textContent = o.label;
    b.onclick = () => setRestDur(o.d);
    wrap.appendChild(b);
  });
}
function setRestDur(d) {
  restDur = d;
  document.querySelectorAll('.rest-dur-btn').forEach(b => b.classList.toggle('sel', +b.dataset.d===d));
  if (restTimer) { restSecs = d; updateRestDisplay(); }
}
function startRest() {
  clearInterval(restTimer);
  restSecs = restDur;
  document.getElementById('rest-main').style.display = '';
  document.getElementById('skip-rest-btn').style.display = '';
  document.getElementById('rest-label').textContent = 'Rest';
  updateRestDisplay();
  restTimer = setInterval(() => {
    restSecs--;
    if (restSecs <= 0) {
      clearInterval(restTimer); restTimer = null;
      restSecs = 0; updateRestDisplay(); playPing();
      document.getElementById('rest-label').textContent = 'Rest Done ✓';
      document.getElementById('rest-display').className = 'rest-display';
      document.getElementById('skip-rest-btn').style.display = 'none';
      setTimeout(() => { document.getElementById('rest-main').style.display='none'; document.getElementById('rest-label').textContent='Rest'; }, 2500);
    } else { updateRestDisplay(); }
  }, 1000);
}
function updateRestDisplay() {
  const el = document.getElementById('rest-display');
  el.textContent = Math.floor(restSecs/60)+':'+String(restSecs%60).padStart(2,'0');
  el.className = 'rest-display'+(restSecs>0&&restSecs<=10?' urgent':'');
}
function skipRest() {
  clearInterval(restTimer); restTimer = null;
  document.getElementById('rest-main').style.display = 'none';
  document.getElementById('skip-rest-btn').style.display = 'none';
  document.getElementById('rest-label').textContent = 'Rest';
}
function playPing() {
  try {
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    [0,0.3].forEach(t => {
      const o=ac.createOscillator(), g=ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.frequency.value=880;
      g.gain.setValueAtTime(0.3,ac.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+t+0.4);
      o.start(ac.currentTime+t); o.stop(ac.currentTime+t+0.4);
    });
  } catch(e){}
}

// ── EXERCISE SUGGESTIONS ───────────────────────────────────────────────────────
function getMuscleExSet(muscles=[]) {
  const s=new Set();
  muscles.forEach(m=>(MUSCLE_EXERCISES[m]||[]).forEach(e=>s.add(e)));
  return s;
}
function showSuggest(val){
  const list=document.getElementById('ex-suggest');
  const muscles=modalCtx.muscles||[];
  const muscleSet=getMuscleExSet(muscles);
  if(!val&&!muscleSet.size){ list.style.display='none'; return; }
  let matches;
  if(!val){
    // No text yet — show muscle-relevant suggestions
    matches=[...muscleSet].slice(0,9);
  } else {
    const q=val.toLowerCase();
    const rel=EXERCISE_LIB.filter(e=>e.toLowerCase().includes(q)&&muscleSet.has(e));
    const other=EXERCISE_LIB.filter(e=>e.toLowerCase().includes(q)&&!muscleSet.has(e));
    matches=[...rel,...other].slice(0,9);
  }
  if(!matches.length){ list.style.display='none'; return; }
  const muscleSetAll=getMuscleExSet(muscles);
  list.innerHTML=matches.map(e=>{
    const cls=(!val&&muscleSetAll.has(e))||muscleSetAll.has(e)?'suggest-item muscle-match':'suggest-item';
    return `<li class="${cls}" onmousedown="pickSuggest(${JSON.stringify(e)})">${e}</li>`;
  }).join('');
  list.style.display='block';
}
function hideSuggest(){ const l=document.getElementById('ex-suggest'); if(l) l.style.display='none'; }
function pickSuggest(name){ document.getElementById('input-ex-name').value=name; hideSuggest(); }

function openEditRoutine(id){ const r=routines.find(x=>x.id===id); if(!r) return; modalCtx={editId:id}; document.getElementById('modal-routine-title').textContent='Rename Routine'; document.getElementById('input-routine-name').value=r.name; openModal('modal-routine'); setTimeout(()=>{const i=document.getElementById('input-routine-name');i.focus();i.select();},80); }

function openEditDay(rId,dId){ const r=routines.find(x=>x.id===rId); const day=r?.days.find(d=>d.id===dId); if(!day)return; modalCtx={rId,editId:dId}; modalMuscles=[...day.muscles]; document.getElementById('modal-day-title').textContent='Edit Training Day'; document.getElementById('input-day-name').value=day.name; refreshModalMuscles(); openModal('modal-day'); setTimeout(()=>{const i=document.getElementById('input-day-name');i.focus();i.select();},80); }
function saveDay(){ const name=document.getElementById('input-day-name').value.trim(); if(!name)return; const r=routines.find(x=>x.id===modalCtx.rId); if(!r)return; if(modalCtx.editId){const day=r.days.find(d=>d.id===modalCtx.editId);if(day){day.name=name;day.muscles=[...modalMuscles];}}else{r.days.push({id:uid(),name,muscles:[...modalMuscles],exercises:[]});} persist(LS_R,routines); closeModal('modal-day'); renderBuilder(); }

function openNewExercise(rId,dId){
  const day=routines.find(r=>r.id===rId)?.days.find(d=>d.id===dId);
  modalCtx={rId,dId,muscles:day?.muscles||[]};
  document.getElementById('input-ex-name').value=''; document.getElementById('input-ex-notes').value='';
  document.getElementById('input-ex-sets').value='3'; document.getElementById('input-ex-reps').value='8-12'; document.getElementById('input-ex-weight').value='';
  document.getElementById('modal-ex-title').textContent='Add Exercise';
  // Show muscle hint
  const hint=document.getElementById('ex-muscle-hint');
  const names=(day?.muscles||[]).map(m=>MUSCLES.find(x=>x.id===m)?.label||m);
  if(names.length){hint.textContent='✦ Showing suggestions for: '+names.join(', ');hint.style.display='';}else{hint.style.display='none';}
  openModal('modal-exercise');
  setTimeout(()=>{document.getElementById('input-ex-name').focus();showSuggest('');},80);
}
function openEditExercise(rId,dId,exId){
  const day=routines.find(r=>r.id===rId)?.days.find(d=>d.id===dId);
  const ex=day?.exercises.find(e=>e.id===exId); if(!ex)return;
  modalCtx={rId,dId,editId:exId,muscles:day?.muscles||[]};
  document.getElementById('input-ex-name').value=ex.name; document.getElementById('input-ex-sets').value=ex.sets;
  document.getElementById('input-ex-reps').value=ex.reps; document.getElementById('input-ex-weight').value=ex.weight||''; document.getElementById('input-ex-notes').value=ex.notes||'';
  document.getElementById('modal-ex-title').textContent='Edit Exercise';
  document.getElementById('ex-muscle-hint').style.display='none';
  openModal('modal-exercise');
  setTimeout(()=>{const i=document.getElementById('input-ex-name');i.focus();i.select();},80);
}
function saveExercise(){
  const name=document.getElementById('input-ex-name').value.trim(); if(!name)return;
  const sets=parseInt(document.getElementById('input-ex-sets').value)||3;
  const reps=document.getElementById('input-ex-reps').value.trim()||'8-12';
  const weight=parseFloat(document.getElementById('input-ex-weight').value)||0;
  const notes=document.getElementById('input-ex-notes').value.trim();
  const day=routines.find(r=>r.id===modalCtx.rId)?.days.find(d=>d.id===modalCtx.dId); if(!day)return;
  if(modalCtx.editId){const ex=day.exercises.find(e=>e.id===modalCtx.editId);if(ex)Object.assign(ex,{name,sets,reps,weight,notes});}
  else{day.exercises.push({id:uid(),name,sets,reps,weight,notes});}
  persist(LS_R,routines); closeModal('modal-exercise');
  renderBuilder();
  const targetDayId=modalCtx.dId;
  setTimeout(()=>{const c=document.getElementById('dc-'+targetDayId);if(c&&!c.classList.contains('open'))c.classList.add('open');},30);
}
function delExercise(rId,dId,exId){ const day=routines.find(r=>r.id===rId)?.days.find(d=>d.id===dId); if(!day)return; day.exercises=day.exercises.filter(e=>e.id!==exId); persist(LS_R,routines); renderBuilder(); setTimeout(()=>{const c=document.getElementById('dc-'+dId);if(c&&!c.classList.contains('open'))c.classList.add('open');},30); }

    <div style="margin-bottom:20px">
      <div style="font-size:1.15rem;font-weight:900;margin-bottom:6px">⭐ Workout Programs</div>
      <div style="color:var(--muted);font-size:.85rem">Pick a program and add it to your routines. You can then edit it to fit your schedule.</div>
    </div>
    <div class="preset-grid">
      ${PRESETS.map(p=>{
        const allMuscles=[...new Set(p.days.flatMap(d=>d.muscles))];
        const added=cloned.has(p.id);
        return `<div class="preset-card${document.getElementById('pc-'+p.id)?.classList.contains('open')?' open':''}" id="pc-${p.id}">
          <div class="preset-card-header" onclick="togglePreset('${p.id}')">
            <div class="preset-icon">${p.icon}</div>
            <div class="preset-info">
              <div class="preset-name">${p.name}</div>
              <div class="preset-tagline">${p.tagline}</div>
              <div class="preset-badges">
                <span class="badge badge-green">${p.days.length} days</span>
                <span class="badge">${p.freq}</span>
                <span class="badge">${p.difficulty}</span>
              </div>
            </div>
          </div>
          <div class="preset-body">
            <div style="display:flex;gap:10px;margin-bottom:14px;opacity:.8">
              ${bodySVG(allMuscles,'front',false,62)}
              ${bodySVG(allMuscles,'back',false,62)}
              <div style="flex:1;min-width:0">
                <div style="font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:6px">Muscles Trained</div>
                <div class="muscle-chips">${allMuscles.map(m=>`<span class="muscle-chip sel" style="font-size:.65rem;padding:2px 7px">${MUSCLES.find(x=>x.id===m)?.label||m}</span>`).join('')}</div>
              </div>
            </div>
            <div class="sec-lbl">Training Days</div>
            ${p.days.map(d=>`<div class="preset-day-row">
              <span class="preset-day-name">${d.name}</span>
              <span class="preset-day-exs">${d.exercises.map(e=>e.name).join(' · ')}</span>
            </div>`).join('')}
            <button class="preset-add-btn${added?' added':''}" onclick="clonePreset('${p.id}')" ${added?'disabled':''}>
              ${added?'✓ Added to My Routines':'+ Add to My Routines'}
            </button>
          </div>
        </div>`;
      }).join('')}
    </div>
    <div style="text-align:center;margin-top:24px">
      <a href="workout-templates.html" style="color:var(--muted);font-size:.82rem;font-weight:700;text-decoration:none;transition:color .2s" onmouseover="this.style.color='var(--acc)'" onmouseout="this.style.color='var(--muted)'">View full program guides →</a>
    </div>`;
}

function togglePreset(id){
  document.getElementById('pc-'+id)?.classList.toggle('open');
}

function clonePreset(id){
  const p=PRESETS.find(x=>x.id===id); if(!p)return;
  const routine={
    id:uid(), name:p.name,
    days:p.days.map(d=>({
      id:uid(), name:d.name, muscles:[...d.muscles],
      exercises:d.exercises.map(ex=>({id:uid(),...ex}))
    }))
  };
  routines.push(routine); persist(LS_R,routines);
  selRoutineId=routine.id;
  const cloned=load('wob_cloned_presets',[]); cloned.push(id); persist('wob_cloned_presets',cloned);
  showToast('✓ '+p.name+' added to your routines!');
  renderPresets();
}

// ── TRAIN ──────────────────────────────────────────────────────────────────────
let activeSession=null, timerInterval=null, sessionSecs=0;

function renderTrain(){
  const el=document.getElementById('view-train');
  if(activeSession){renderSession();return;}
  if(routines.length===0){
    el.innerHTML=`<div class="empty"><span class="empty-icon">🏗️</span><div class="empty-text">Build a routine first, then come back here to train.<br><br><button class="btn btn-ghost btn-sm" onclick="switchTab('presets')">⭐ Browse Presets</button></div></div>`;
    return;
  }
  el.innerHTML=`<h2 style="font-size:1.1rem;font-weight:900;margin-bottom:16px">Start a Session</h2>
    ${routines.map(r=>`<div class="card" style="margin-bottom:14px"><div style="padding:16px 18px">
      <div style="font-weight:900;font-size:1rem;margin-bottom:12px">${r.name}</div>
      ${r.days.length===0?`<div style="color:var(--muted);font-size:.82rem">No days added yet.</div>`:''}
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        ${r.days.map(d=>`<button class="btn btn-ghost" onclick="startSession('${r.id}','${d.id}')" style="display:flex;align-items:center;gap:10px;padding:10px 14px">
          <div style="display:flex;gap:4px">${bodySVG(d.muscles,'front',false,28)}${bodySVG(d.muscles,'back',false,28)}</div>
          <div style="text-align:left"><div style="font-weight:800;font-size:.88rem">${d.name}</div><div style="color:var(--muted);font-size:.7rem">${d.muscles.slice(0,4).map(m=>MUSCLES.find(x=>x.id===m)?.label||m).join(', ')}${d.muscles.length>4?'…':''}</div></div>
        </button>`).join('')}
      </div>
    </div></div>`).join('')}`;
}

function startSession(rId,dId){
  const r=routines.find(x=>x.id===rId); const d=r?.days.find(x=>x.id===dId); if(!d)return;
  activeSession={id:uid(),routineId:rId,routineName:r.name,dayId:dId,dayName:d.name,muscles:d.muscles,date:new Date().toISOString(),
    exercises:d.exercises.map(ex=>({exerciseId:ex.id,name:ex.name,targetSets:ex.sets,targetReps:ex.reps,targetWeight:ex.weight,notes:ex.notes,
      sets:Array.from({length:ex.sets},()=>({reps:'',weight:ex.weight||'',done:false}))}))};
  sessionSecs=0;
  document.getElementById('timer-bar').style.display='flex';
  timerInterval=setInterval(()=>{sessionSecs++;document.getElementById('timer-display').textContent=String(Math.floor(sessionSecs/60)).padStart(2,'0')+':'+String(sessionSecs%60).padStart(2,'0');},1000);
  switchTab('train');
}

function renderSession(){
  const el=document.getElementById('view-train');
  el.innerHTML=`<div class="row mb16">
    <div><div style="font-weight:900;font-size:1.1rem">${activeSession.dayName}</div><div style="color:var(--muted);font-size:.78rem">${activeSession.routineName}</div></div>
    <div style="margin-left:auto;display:flex;gap:6px">${bodySVG(activeSession.muscles,'front',false,48)}${bodySVG(activeSession.muscles,'back',false,48)}</div>
  </div>
  ${activeSession.exercises.map((ex,ei)=>`<div class="session-ex">
    <div class="session-ex-header"><span class="session-ex-name">${ex.name}</span><span class="session-ex-target">${ex.targetSets}×${ex.targetReps}${ex.targetWeight>0?' · '+ex.targetWeight+'lbs':''}${ex.notes?' · '+ex.notes:''}</span></div>
    <div style="background:rgba(255,255,255,0.03);padding:6px 17px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;gap:10px">
      <span style="color:var(--muted);font-size:.65rem;width:28px">SET</span>
      <span style="color:var(--muted);font-size:.65rem;width:68px;text-align:center">WEIGHT</span>
      <span style="width:16px"></span>
      <span style="color:var(--muted);font-size:.65rem;width:68px;text-align:center">REPS</span>
    </div>
    ${ex.sets.map((set,si)=>`<div class="set-row" id="sr-${ei}-${si}" style="${set.done?'opacity:.55':''}">
      <span class="set-num">${si+1}</span>
      <input class="set-input" type="number" min="0" placeholder="lbs" value="${set.weight}" oninput="updSet(${ei},${si},'weight',this.value)">
      <span class="set-sep">×</span>
      <input class="set-input" type="number" min="0" placeholder="reps" value="${set.reps}" oninput="updSet(${ei},${si},'reps',this.value)">
      <button class="set-check${set.done?' done':''}" onclick="togSet(${ei},${si})">${set.done?'✓':''}</button>
    </div>`).join('')}
    <div class="set-row"><button class="btn btn-ghost btn-sm" onclick="addSet(${ei})">+ Set</button></div>
  </div>`).join('')}
  <div style="height:80px"></div>`;
}

function updSet(ei,si,field,val){ if(activeSession)activeSession.exercises[ei].sets[si][field]=val; }
function togSet(ei,si){
  if(!activeSession)return;
  const row=document.getElementById(`sr-${ei}-${si}`);
  if(row){const ins=row.querySelectorAll('.set-input');activeSession.exercises[ei].sets[si].weight=ins[0]?.value||'';activeSession.exercises[ei].sets[si].reps=ins[1]?.value||'';}
  const set=activeSession.exercises[ei].sets[si]; set.done=!set.done;
  if(set.done)startRest();
  if(row){row.style.opacity=set.done?'0.55':'1';const btn=row.querySelector('.set-check');btn.classList.toggle('done',set.done);btn.textContent=set.done?'✓':'';}
}
function addSet(ei){ if(!activeSession)return; const ex=activeSession.exercises[ei]; const last=ex.sets[ex.sets.length-1]||{}; ex.sets.push({reps:last.reps||'',weight:last.weight||ex.targetWeight||'',done:false}); renderSession(); }
function finishSession(){
  if(!activeSession||!confirm('Finish this workout?'))return;
  clearInterval(timerInterval);timerInterval=null; clearInterval(restTimer);restTimer=null;
  document.getElementById('timer-bar').style.display='none'; document.getElementById('rest-main').style.display='none'; document.getElementById('skip-rest-btn').style.display='none';
  activeSession.duration=sessionSecs; sessions.push(activeSession); persist(LS_S,sessions);
  activeSession=null; sessionSecs=0; switchTab('history');
}

// ── HISTORY ────────────────────────────────────────────────────────────────────
function renderHistory(){
  const el=document.getElementById('view-history');
  if(sessions.length===0){el.innerHTML=`<div class="empty"><span class="empty-icon">📊</span><div class="empty-text">No sessions yet. Start training to see your history here.</div></div>`;return;}
  const grouped={};
  [...sessions].reverse().forEach(s=>{const key=new Date(s.date).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric',year:'numeric'});if(!grouped[key])grouped[key]=[];grouped[key].push(s);});
  el.innerHTML=Object.entries(grouped).map(([date,ss])=>`
    <div class="hist-date-label">${date}</div>
    ${ss.map(s=>`<div class="hist-item">
      <div class="row"><div style="flex:1"><div class="hist-title">${s.dayName}</div><div class="hist-meta">${s.routineName} · ${fmtDur(s.duration)} · ${s.exercises.length} exercises</div></div>
      <div style="display:flex;gap:4px;opacity:.75">${bodySVG(s.muscles||[],'front',false,42)}${bodySVG(s.muscles||[],'back',false,42)}</div></div>
      <div class="hist-chips">${s.exercises.map(ex=>{const done=ex.sets.filter(x=>x.done).length;return `<span class="hist-chip">${ex.name} <span style="opacity:.55">${done}/${ex.sets.length}</span></span>`;}).join('')}</div>
    </div>`).join('')}
  `).join('');
}
function fmtDur(s){ if(!s)return'—'; return Math.floor(s/60)+'m '+(s%60)+'s'; }

// ── KEYBOARD ───────────────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  const overlay=document.querySelector('.modal-overlay.open'); if(!overlay)return;
  if(e.key==='Escape'){document.querySelectorAll('.modal-overlay.open').forEach(m=>m.classList.remove('open'));hideSuggest();}
  if(e.key==='Enter'&&!e.shiftKey){const tag=document.activeElement.tagName;if(tag==='BUTTON')return;const id=overlay.id;if(id==='modal-routine')saveRoutine();else if(id==='modal-day')saveDay();else if(id==='modal-exercise')saveExercise();}
});

// ── INIT ───────────────────────────────────────────────────────────────────────
initRestBtns();
renderBuilder();
</script>
</body>
</html>
