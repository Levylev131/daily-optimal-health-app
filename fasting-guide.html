<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fasting Guide — Daily Optimal Health</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --acc: #2dd46e; --glow: rgba(45,212,110,0.35);
      --bg1: #061a0c; --bg2: #0d4a24; --bg3: #061a0c;
      --glass: rgba(255,255,255,0.07); --glass-b: rgba(255,255,255,0.13);
      --glass-h: rgba(255,255,255,0.12);
      --text: #f0fff4; --muted: rgba(240,255,244,0.55);
      --r: 14px; --r-sm: 10px;
      --amber: #f5a623;
    }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
      background-size: 400% 400%;
      animation: gradShift 18s ease infinite;
      color: var(--text); min-height: 100vh; overflow-x: hidden;
    }
    @keyframes gradShift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
    .top-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 24px; max-width: 900px; margin: 0 auto;
      border-bottom: 1px solid var(--glass-b);
      position: sticky; top: 0; z-index: 100;
      background: rgba(6,26,12,0.85); backdrop-filter: blur(16px);
    }
    .back-btn { color: var(--muted); text-decoration: none; font-size: .88rem; font-weight: 600; transition: color .2s; background: none; border: none; cursor: pointer; }
    .back-btn:hover { color: var(--acc); }
    .top-title { flex: 1; text-align: center; font-size: 1rem; font-weight: 800; text-shadow: 0 0 20px var(--glow); }
    .top-spacer { width: 60px; }
    .page { max-width: 900px; margin: 0 auto; padding: clamp(16px,4vw,28px) clamp(12px,3vw,20px) 100px; }
    .hero { text-align: center; padding: clamp(20px,4vw,32px) 0 clamp(14px,3vw,24px); }
    .hero-emoji { font-size: clamp(2.5rem,7vw,4rem); display: block; margin-bottom: 10px; filter: drop-shadow(0 0 16px var(--glow)); }
    .hero-title {
      font-size: clamp(1.6rem,5vw,2.6rem); font-weight: 900; letter-spacing: -1px; line-height: 1.1;
      background: linear-gradient(135deg, #fff 30%, var(--acc));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 8px;
    }
    .hero-sub { color: var(--muted); font-size: clamp(.84rem,2vw,.98rem); max-width: 540px; margin: 0 auto; line-height: 1.6; }
    .card {
      background: var(--glass); border: 1px solid var(--glass-b);
      border-radius: var(--r); backdrop-filter: blur(12px);
      margin-bottom: 14px; overflow: hidden; transition: border-color .2s;
    }
    .card.open { border-color: rgba(45,212,110,0.35); }
    .card-header {
      display: flex; align-items: center; gap: 16px;
      padding: clamp(14px,3vw,20px); cursor: pointer;
      transition: background .15s; user-select: none;
    }
    .card-header:hover { background: var(--glass-h); }
    .card-icon {
      font-size: clamp(1.8rem,5vw,2.4rem); flex-shrink: 0;
      width: clamp(48px,10vw,62px); height: clamp(48px,10vw,62px);
      background: rgba(45,212,110,0.1); border: 1px solid rgba(45,212,110,0.2);
      border-radius: 14px; display: flex; align-items: center; justify-content: center;
    }
    .card-meta { flex: 1; min-width: 0; }
    .card-name { font-size: clamp(.98rem,2.8vw,1.2rem); font-weight: 900; margin-bottom: 3px; }
    .card-tagline { color: var(--muted); font-size: .8rem; font-style: italic; }
    .expand-arrow { color: var(--muted); font-size: .8rem; transition: transform .25s; margin-left: 8px; flex-shrink: 0; }
    .card.open .expand-arrow { transform: rotate(180deg); }
    .card-body {
      max-height: 0; overflow: hidden;
      transition: max-height .45s cubic-bezier(.4,0,.2,1);
      border-top: 1px solid transparent;
    }
    .card.open .card-body { max-height: 2000px; border-top-color: var(--glass-b); }
    .card-inner { padding: clamp(14px,3vw,22px); display: flex; flex-direction: column; gap: 18px; }
    .points { display: flex; flex-direction: column; gap: 10px; }
    .point { display: flex; gap: 12px; align-items: flex-start; font-size: .86rem; line-height: 1.6; }
    .point-dot {
      width: 22px; height: 22px; border-radius: 50%;
      background: rgba(45,212,110,0.18); color: var(--acc);
      font-size: .72rem; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 1px;
    }
    .sec-lbl {
      font-size: .68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.3px;
      color: var(--muted); margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
    }
    .sec-lbl::after { content:''; flex:1; height:1px; background: var(--glass-b); }
    .protocol-box {
      background: rgba(255,255,255,0.04); border: 1px solid var(--glass-b);
      border-radius: var(--r-sm); padding: 14px;
      font-size: .83rem; line-height: 1.65; color: rgba(240,255,244,0.88);
    }
    .tip-box {
      background: rgba(245,166,35,0.08); border: 1px solid rgba(245,166,35,0.28);
      border-radius: var(--r-sm); padding: 13px 15px; font-size: .82rem; line-height: 1.65;
    }
    .tip-label { color: var(--amber); font-weight: 800; margin-bottom: 4px; font-size: .7rem; text-transform: uppercase; letter-spacing: .8px; }
  </style>
  <script src="health-notifications.js" defer></script>
</head>
<body>

<div class="top-bar">
  <button class="back-btn" onclick="history.length > 1 ? history.back() : location.href='index.html'">← Back</button>
  <div class="top-title">⏳ Fasting Guide</div>
  <div class="top-spacer"></div>
</div>

<div class="page">

  <div class="hero">
    <span class="hero-emoji">🔥</span>
    <div class="hero-title">The Complete Fasting Guide</div>
    <div class="hero-sub">Every protocol from 16:8 to extended fasts — with the mechanism behind why each one works.</div>
  </div>

  <div id="list"></div>

</div>

      'Autophagy peaks at 24–48 hours — the 24h+ range triggers significantly more cellular waste clearance than daily IF can achieve, representing a qualitatively different metabolic event.',

  },
  {
    id: 'breaking-fast',
    emoji: '🥗',
    name: 'Breaking the Fast — Optimal Refeeding',
    tagline: 'What you eat first matters more the longer the fast',
    points: [

      'Breaking with protein first blunts the post-fast insulin spike by slowing gastric emptying and stimulating glucagon — a more gradual re-entry into the fed state.',
      'For 24h+ fasts, gut digestive enzyme activity partially downregulates — breaking with large complex meals causes GI distress that is entirely avoided by gradual refeeding.',
      'The first meal after a fast sets the metabolic tone for the rest of the eating window — a protein-first, fiber-first opening meal maintains the insulin-sensitized state longer.',
    ],
    protocol: 'Daily 16:8 break: any nutritionally complete meal — optimization here is minimal. 24h break: bone broth first (electrolytes + gut primer), then a normal protein meal 30 min later. 48h+ break: 250ml bone broth → wait 30 min → small protein meal (eggs, chicken) → wait 1 hour → normal meal. Always break extended fasts with protein + vegetables before carbohydrates.',
    tip: 'For daily 16:8, the "how to break a fast" optimization discourse is largely noise — eating a donut vs. a steak as your first meal after a 16-hour fast has minimal impact on the day\'s outcomes. Refeeding optimization matters for extended fasts (24h+) when gut sensitivity is elevated and electrolyte management is a real concern. Don\'t overcomplicate daily IF refeeding.',

const list = document.getElementById('list');
list.innerHTML = CARDS.map(c => `
  <div class="card" id="${c.id}">
    <div class="card-header" onclick="toggle('${c.id}')">
      <div class="card-icon">${c.emoji}</div>
      <div class="card-meta">
        <div class="card-name">${c.name}</div>
        <div class="card-tagline">${c.tagline}</div>
      </div>
      <span class="expand-arrow">▼</span>
    </div>
    <div class="card-body">
      <div class="card-inner">
        <div class="points">
          ${c.points.map((p,i) => `<div class="point"><div class="point-dot">${i+1}</div><span>${p}</span></div>`).join('')}
        </div>
        <div><div class="sec-lbl">Protocol</div><div class="protocol-box">${c.protocol}</div></div>
        <div class="tip-box"><div class="tip-label">Pro Tip</div>${c.tip}</div>
      </div>
    </div>
  </div>
`).join('');

function toggle(id) { document.getElementById(id).classList.toggle('open'); }
</script>
</body>
</html>
