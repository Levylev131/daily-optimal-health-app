<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anterior Pelvic Tilt Guide — Daily Optimal Health</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --acc: #2dd46e; --glow: rgba(45,212,110,0.35);
      --bg1: #061a0c; --bg2: #0d4a24; --bg3: #061a0c;
      --glass: rgba(255,255,255,0.07); --glass-b: rgba(255,255,255,0.13);
      --glass-h: rgba(255,255,255,0.12);
      --text: #f0fff4; --muted: rgba(240,255,244,0.55);
      --r: 14px; --r-sm: 10px;
      --amber: #f5a623;
    }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
      background-size: 400% 400%;
      animation: gradShift 18s ease infinite;
      color: var(--text); min-height: 100vh; overflow-x: hidden;
    }
    @keyframes gradShift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
    .top-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 24px; max-width: 900px; margin: 0 auto;
      border-bottom: 1px solid var(--glass-b);
      position: sticky; top: 0; z-index: 100;
      background: rgba(6,26,12,0.85); backdrop-filter: blur(16px);
    }
    .back-btn { color: var(--muted); text-decoration: none; font-size: .88rem; font-weight: 600; transition: color .2s; background: none; border: none; cursor: pointer; }
    .back-btn:hover { color: var(--acc); }
    .top-title { flex: 1; text-align: center; font-size: 1rem; font-weight: 800; text-shadow: 0 0 20px var(--glow); }
    .top-spacer { width: 60px; }
    .page { max-width: 900px; margin: 0 auto; padding: clamp(16px,4vw,28px) clamp(12px,3vw,20px) 100px; }
    .hero { text-align: center; padding: clamp(20px,4vw,32px) 0 clamp(14px,3vw,24px); }
    .hero-emoji { font-size: clamp(2.5rem,7vw,4rem); display: block; margin-bottom: 10px; filter: drop-shadow(0 0 16px var(--glow)); }
    .hero-title {
      font-size: clamp(1.6rem,5vw,2.6rem); font-weight: 900; letter-spacing: -1px; line-height: 1.1;
      background: linear-gradient(135deg, #fff 30%, var(--acc));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 8px;
    }
    .hero-sub { color: var(--muted); font-size: clamp(.84rem,2vw,.98rem); max-width: 540px; margin: 0 auto; line-height: 1.6; }
    .card {
      background: var(--glass); border: 1px solid var(--glass-b);
      border-radius: var(--r); backdrop-filter: blur(12px);
      margin-bottom: 14px; overflow: hidden; transition: border-color .2s;
    }
    .card.open { border-color: rgba(45,212,110,0.35); }
    .card-header {
      display: flex; align-items: center; gap: 16px;
      padding: clamp(14px,3vw,20px); cursor: pointer;
      transition: background .15s; user-select: none;
    }
    .card-header:hover { background: var(--glass-h); }
    .card-icon {
      font-size: clamp(1.8rem,5vw,2.4rem); flex-shrink: 0;
      width: clamp(48px,10vw,62px); height: clamp(48px,10vw,62px);
      background: rgba(45,212,110,0.1); border: 1px solid rgba(45,212,110,0.2);
      border-radius: 14px; display: flex; align-items: center; justify-content: center;
    }
    .step-num {
      font-size: .65rem; font-weight: 900; color: var(--acc);
      position: absolute; top: 5px; right: 6px; opacity: .7;
    }
    .card-icon-wrap { position: relative; }
    .card-meta { flex: 1; min-width: 0; }
    .card-name { font-size: clamp(.98rem,2.8vw,1.2rem); font-weight: 900; margin-bottom: 3px; }
    .card-tagline { color: var(--muted); font-size: .8rem; font-style: italic; }
    .expand-arrow { color: var(--muted); font-size: .8rem; transition: transform .25s; margin-left: 8px; flex-shrink: 0; }
    .card.open .expand-arrow { transform: rotate(180deg); }
    .card-body {
      max-height: 0; overflow: hidden;
      transition: max-height .45s cubic-bezier(.4,0,.2,1);
      border-top: 1px solid transparent;
    }
    .card.open .card-body { max-height: 2000px; border-top-color: var(--glass-b); }
    .card-inner { padding: clamp(14px,3vw,22px); display: flex; flex-direction: column; gap: 18px; }
    .points { display: flex; flex-direction: column; gap: 10px; }
    .point { display: flex; gap: 12px; align-items: flex-start; font-size: .86rem; line-height: 1.6; }
    .point-dot {
      width: 22px; height: 22px; border-radius: 50%;
      background: rgba(45,212,110,0.18); color: var(--acc);
      font-size: .72rem; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 1px;
    }
    .sec-lbl {
      font-size: .68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.3px;
      color: var(--muted); margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
    }
    .sec-lbl::after { content:''; flex:1; height:1px; background: var(--glass-b); }
    .protocol-box {
      background: rgba(255,255,255,0.04); border: 1px solid var(--glass-b);
      border-radius: var(--r-sm); padding: 14px;
      font-size: .83rem; line-height: 1.65; color: rgba(240,255,244,0.88);
    }
    .tip-box {
      background: rgba(245,166,35,0.08); border: 1px solid rgba(245,166,35,0.28);
      border-radius: var(--r-sm); padding: 13px 15px; font-size: .82rem; line-height: 1.65;
    }
    .tip-label { color: var(--amber); font-weight: 800; margin-bottom: 4px; font-size: .7rem; text-transform: uppercase; letter-spacing: .8px; }
  </style>
  <script src="health-notifications.js" defer></script>
</head>
<body>

<div class="top-bar">
  <button class="back-btn" onclick="history.length > 1 ? history.back() : location.href='index.html'">← Back</button>
  <div class="top-title">⚖️ Anterior Pelvic Tilt</div>
  <div class="top-spacer"></div>
</div>

<div class="page">

  <div class="hero">
    <span class="hero-emoji">🦴</span>
    <div class="hero-title">Fix Anterior Pelvic Tilt</div>
    <div class="hero-sub">A 7-step correction protocol for the most common postural dysfunction in desk workers. Work through them in order.</div>
  </div>

  <div id="list"></div>

</div>

<script>
const CARDS = [
  {
    id: 'understanding',
    emoji: '🔍',
    name: 'Understand APT',
    tagline: 'The anatomy and muscular imbalance behind it',
    points: [
      'APT is a forward pelvic rotation — the front of the pelvis drops, the lower back arches excessively. Root cause: tight hip flexors + tight lumbar extensors on one side, weak glutes + weak deep abs on the other.',
      'The psoas directly attaches to the lumbar vertebrae (L1–L5). When shortened from hours of sitting, it physically pulls the spine into an arch — which is why "just sit up straight" doesn\'t work.',
      'Reciprocal inhibition: tight hip flexors neurologically switch off the glutes. People with APT can\'t feel their glutes fire during exercise because the nervous system has downregulated them, not just weakened them.',
      'APT is estimated to affect 75–85% of desk workers and is so common it\'s frequently mistaken for normal posture.',
    ],
    protocol: 'Self-assess with the wall test: stand with heels, back, and head against a wall. Slide your hand flat behind your lower back. More than a hand\'s-width gap = significant APT. Also: lie flat, pull one knee to chest — if the other leg lifts off the table (Thomas test), that hip flexor is tight. Re-test monthly. Aim to reduce the wall gap to hand-flat width over 8–12 weeks.',
    tip: 'The wall test takes 10 seconds and is the clearest first indicator. Most people are surprised by how much space there is behind their lower back. Do it now before continuing.',
  },
  {
    id: 'hip-flexors',
    emoji: '🦵',
    name: 'Release Hip Flexors',
    tagline: 'The primary driver — this is where to start and spend the most time',
    points: [
      'The couch stretch is the most effective hip flexor stretch available. It targets the psoas, iliacus, rectus femoris, and TFL simultaneously — but only when you add the posterior pelvic tilt cue (tuck the tailbone). Without the tuck, the stretch bypasses the psoas.',
      'Daily 90-second holds, not aggressive weekly sessions. Flexibility is built by teaching the nervous system daily that the range is safe — not by forcing it once a week.',
      'As the psoas lengthens, it stops pulling the lumbar spine forward. Lumbar arch visibly decreases, and lower back pain often reduces substantially within 2–4 weeks.',
    ],
    protocol: 'Couch stretch: kneel facing away from a wall. Place shin up the wall (knee near floor). Step front foot forward to ~90°. Actively squeeze the back glute and tuck the pelvis under — this is the critical cue. Hold 90 seconds per side. Discomfort should be felt at the front of the back hip, not the knee. Do this morning + evening, daily for minimum 30 days.',
    tip: 'Week 1 is uncomfortable. Week 4 is almost comfortable. The discomfort is tissue that has structurally shortened over months of sitting — not an injury signal. Progress is felt as the front of the hip gradually allowing a deeper lunge position.',
  },
  {
    id: 'glutes',
    emoji: '💪',
    name: 'Activate Glutes',
    tagline: 'Reawakening the inhibited antagonist',
    points: [
      '"I can\'t feel my glutes" is nearly universal in APT — not because glutes are weak from disuse, but because the nervous system has actively downregulated them via reciprocal inhibition from tight hip flexors. Releasing hip flexors first is the unlock.',
      'The glute max\'s job is to pull the back of the pelvis down — the exact movement needed to correct anterior tilt. Strengthening it is the active correction to the hip flexor\'s passive pull.',
      'Activation drills before compound movements re-establish the neural connection, making glute contribution to squats and deadlifts immediately larger.',
    ],
    protocol: 'Glute bridge: lie on back, feet flat. Squeeze the glutes first — then drive hips up. Hold 2 seconds at the top. The squeeze-first cue is critical: it overrides the inhibition pattern. If you feel it mostly in your hamstrings, move feet slightly closer to your body. Daily: glute bridge 3×15 (2-sec hold), clamshell 3×15 each side. Progress to: hip thrusts, Bulgarian split squat, Romanian deadlift.',
    tip: 'The cue that unlocks glute activation: "squeeze first, then move." Before any hip extension — bridge, thrust, squat — contract the glutes consciously for 1–2 seconds before the movement starts. People who can\'t feel their glutes during squats almost universally skip this pre-activation step.',
  },
  {
    id: 'core',
    emoji: '🧱',
    name: 'Stabilize Core',
    tagline: 'Deep stabilizers — not crunches',
    points: [
      'The muscles that resist APT under load are not the rectus abdominis (six-pack) — they\'re the transverse abdominis (TVA) and pelvic floor. Crunches don\'t train this. The TVA creates intra-abdominal pressure that stabilizes the lumbar spine without movement.',
      'The dead bug is the foundational APT core exercise: it trains the TVA to maintain posterior pelvic tilt while limbs move — the exact demand of walking, running, and lifting.',
      'Core stability for APT means holding neutral spine under increasing load, not flexing harder. A stable, unmoving pelvis while everything around it moves.',
    ],
    protocol: 'Dead bug: lie on back, press lower back firmly to floor. Extend one arm and the opposite leg slowly while keeping lower back contact. Any lower back lift = stop and reset. Reduce range until you can maintain contact for the full rep. Daily or 5x/week: dead bug 3×8 per side (3 sec down, pause, 3 sec back), McGill curl-up 3×10, side plank 3×20–30 sec each side, bird dog 3×10 per side with 3-sec holds.',
    tip: 'During every dead bug rep: the moment the lower back arches off the floor, the TVA has switched off and the pelvis has anteriorly tilted — you\'ve recreated APT under load. Shorten the limb range until you can maintain full floor contact throughout.',
  },
  {
    id: 'hamstrings',
    emoji: '🏋️',
    name: 'Strengthen Hamstrings',
    tagline: 'The posterior chain pull that assists pelvic correction',
    points: [
      'Hamstrings attach to the sitting bones — when they contract, they pull the back of the pelvis downward, contributing to posterior pelvic tilt. Strengthening them adds another opposing force to the anterior tilt.',
      'Most people with APT perceive tight hamstrings and avoid hamstring work. This tightness is usually neurogenic — the nervous system guarding a weak muscle — not structural shortness. The fix is loading, not more stretching.',
      'Nordic curls increase hamstring fascicle length (genuine structural lengthening) more effectively than static stretching, while also building eccentric strength that prevents strains.',
    ],
    protocol: 'Romanian deadlift: stand hip-width, soft knees. Hinge at the hip — push hips back, not down. Lower until you feel a deep hamstring stretch (typically mid-shin). Pause, then drive hips forward. Lower back stays neutral throughout — no rounding, no excessive arching. Schedule: RDL 3×10 twice weekly. Nordic curl negatives 3×5 (lower as slowly as possible). Lying hamstring stretch 30–60 sec after each set while tissue is warm.',
    tip: 'Repeatedly stretching a neurogenically tight hamstring brings temporary relief but no lasting change — the underlying weakness remains. Progressive loading (RDLs, Nordics) resolves both the tightness and the weakness simultaneously. It is both the diagnosis and the treatment.',
  },
  {
    id: 'lumbar',
    emoji: '🔄',
    name: 'Release Lumbar Tension',
    tagline: 'Decompressing the overworked lower back muscles that hold the arch',
    points: [
      'In APT, the lumbar erectors are chronically holding the spine in extension against gravity — they accumulate significant tension and are a major source of lower back stiffness and pain.',
      'Lumbar flexion stretches (child\'s pose, knees-to-chest) decompress the facet joints — these small vertebral joints become compressed under constant extension load and respond immediately to flexion.',
      'Child\'s pose for 2 minutes provides fast lower back pain relief because the mechanism is mechanical decompression — it works within minutes.',
    ],
    protocol: 'Morning + evening: child\'s pose (2 min) + knees-to-chest rock (60 sec). Child\'s pose: from kneeling, sit back toward heels, arms extended forward. Breathe into the lower back — on each exhale, let the lower back round and release further. Before core work: cat-cow (10 slow cycles). QL rolling: 60 seconds each side (between the bottom rib and hip bone). Do lumbar release before core and glute work — a hypertonic lumbar erector resists the range of motion needed for dead bugs and hip thrusts.',
    tip: 'Do lumbar release before core and glute work, not after. Release first → train second. Morning sequence: lumbar release → hip flexor stretch → glute activation.',
  },
  {
    id: 'habits',
    emoji: '⏰',
    name: 'Fix Daily Habits',
    tagline: 'The correction only sticks if the daily patterns change too',
    points: [
      'All the exercises in this guide will not permanently fix APT if you return to 8+ hours of sitting daily — sitting continuously re-loads the hip flexors into their shortened position, undoing the stretching work.',
      'Neutral pelvis is a skill, not a shape. It requires hundreds of daily conscious repetitions to become automatic. 20 reps per hour × 8 hours = 160 reps/day — at that volume, it starts to become the default within weeks.',
      'Rib flare (lower ribs flaring outward) almost always co-occurs with APT. Fix: on each exhale, let the ribs drop down and in. Neutral pelvis + closed ribs is the complete standing posture.',
    ],
    protocol: 'Break sitting every 45–60 min with 3–5 min standing or walking. Neutral pelvis cue — practice 20× per hour: slightly tuck the pelvis (squeeze glutes, tailbone under), then release 20% of that tuck. That release position is neutral. Gait focus: consciously extend the hip fully at the back of each stride during daily walks. Rib check: 10 exhale-and-close reps per hour. Use a sit timer or phone reminder to break up sitting.',
    tip: 'The neutral pelvis reps are the most important part of this whole guide. All the stretching and strengthening creates the available range — the daily reps determine which position the body defaults to. There is no shortcut to the rep count.',
  },
];

const list = document.getElementById('list');
list.innerHTML = CARDS.map((c, i) => `
  <div class="card" id="${c.id}">
    <div class="card-header" onclick="toggle('${c.id}')">
      <div class="card-icon-wrap">
        <div class="card-icon">${c.emoji}</div>
        <span class="step-num">${i+1}</span>
      </div>
      <div class="card-meta">
        <div class="card-name">${c.name}</div>
        <div class="card-tagline">${c.tagline}</div>
      </div>
      <span class="expand-arrow">▼</span>
    </div>
    <div class="card-body">
      <div class="card-inner">
        <div class="points">
          ${c.points.map((p,j) => `<div class="point"><div class="point-dot">${j+1}</div><span>${p}</span></div>`).join('')}
        </div>
        <div><div class="sec-lbl">Protocol</div><div class="protocol-box">${c.protocol}</div></div>
        <div class="tip-box"><div class="tip-label">Pro Tip</div>${c.tip}</div>
      </div>
    </div>
  </div>
`).join('');

function toggle(id) { document.getElementById(id).classList.toggle('open'); }
</script>
</body>
</html>
