<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programs — Daily Optimal Health</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --acc: #2dd46e; --glow: rgba(45,212,110,0.35);
      --bg1: #061a0c; --bg2: #0d4a24;
      --glass: rgba(255,255,255,0.07); --glass-b: rgba(255,255,255,0.13);
      --glass-h: rgba(255,255,255,0.12);
      --text: #f0fff4; --muted: rgba(240,255,244,0.55);
      --r: 14px; --r-sm: 10px;
    }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg1));
      background-size: 400% 400%; animation: gradShift 18s ease infinite;
      color: var(--text); min-height: 100vh; overflow-x: hidden;
    }
    @keyframes gradShift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }

    .top-bar {
      display:flex; align-items:center; gap:12px;
      padding:14px 24px; max-width:1000px; margin:0 auto;
      border-bottom:1px solid var(--glass-b);
      position:sticky; top:0; z-index:100;
      background:rgba(6,26,12,0.9); backdrop-filter:blur(16px);
    }
    .back-btn { color:var(--muted); font-size:.88rem; font-weight:600; background:none; border:none; cursor:pointer; transition:color .2s; text-decoration:none; }
    .back-btn:hover { color:var(--acc); }
    .top-title { flex:1; text-align:center; font-size:1rem; font-weight:800; text-shadow:0 0 20px var(--glow); }

    .page { max-width:1000px; margin:0 auto; padding:clamp(16px,4vw,32px) clamp(12px,3vw,20px) 80px; }

    .hero { text-align:center; padding:32px 0 28px; }
    .hero h1 { font-size:clamp(1.5rem,4vw,2.2rem); font-weight:900; margin-bottom:10px; text-shadow:0 0 40px var(--glow); }
    .hero p { color:var(--muted); font-size:.92rem; line-height:1.65; max-width:520px; margin:0 auto; }

    .filter-row {
      display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:28px;
    }
    .filter-chip {
      padding:6px 16px; border-radius:20px; font-size:.78rem; font-weight:700;
      cursor:pointer; background:rgba(255,255,255,0.07); border:1px solid var(--glass-b);
      color:var(--muted); transition:all .2s; user-select:none;
    }
    .filter-chip.active { background:rgba(45,212,110,.18); border-color:rgba(45,212,110,.5); color:var(--acc); }

    .prog-grid {
      display:grid; gap:16px;
    }

    .prog-card {
      background:var(--glass); border:1px solid var(--glass-b);
      border-radius:var(--r); overflow:hidden; transition:border-color .2s;
    }
    .prog-card:hover { border-color:rgba(45,212,110,.25); }
    .prog-card.open { border-color:rgba(45,212,110,.35); }

    .prog-header {
      padding:20px 22px; cursor:pointer; display:flex; gap:16px; align-items:flex-start;
      transition:background .15s; user-select:none;
    }
    .prog-header:hover { background:var(--glass-h); }

    .prog-icon {
      font-size:2rem; width:58px; height:58px; flex-shrink:0;
      background:rgba(45,212,110,.1); border:1px solid rgba(45,212,110,.2);
      border-radius:14px; display:flex; align-items:center; justify-content:center;
    }
    .prog-main { flex:1; min-width:0; }
    .prog-name { font-size:1.1rem; font-weight:900; margin-bottom:5px; }
    .prog-tagline { color:var(--muted); font-size:.82rem; line-height:1.55; margin-bottom:10px; }
    .prog-badges { display:flex; gap:6px; flex-wrap:wrap; }
    .badge {
      padding:3px 10px; border-radius:20px; font-size:.7rem; font-weight:700;
      background:rgba(255,255,255,0.08); border:1px solid var(--glass-b); color:var(--muted);
    }
    .badge-green { background:rgba(45,212,110,.12); border-color:rgba(45,212,110,.3); color:var(--acc); }
    .badge-amber { background:rgba(245,166,35,.12); border-color:rgba(245,166,35,.3); color:#f5a623; }
    .badge-red   { background:rgba(255,100,100,.12); border-color:rgba(255,100,100,.3); color:#ff9090; }

    .prog-chevron { color:var(--muted); font-size:.8rem; margin-top:4px; transition:transform .25s; flex-shrink:0; }
    .prog-card.open .prog-chevron { transform:rotate(180deg); }

    .prog-body {
      max-height:0; overflow:hidden; transition:max-height .5s cubic-bezier(.4,0,.2,1);
      border-top:1px solid transparent;
    }
    .prog-card.open .prog-body { max-height:3000px; border-top-color:var(--glass-b); }
    .prog-body-inner { padding:22px; }

    .muscle-overview {
      display:flex; gap:28px; align-items:flex-start; margin-bottom:22px; flex-wrap:wrap;
    }
    .body-pair { display:flex; gap:12px; }
    .body-figure { text-align:center; }
    .body-label { color:var(--muted); font-size:.6rem; font-weight:800; text-transform:uppercase; letter-spacing:.8px; margin-bottom:4px; }
    .muscle-legend { flex:1; min-width:180px; }
    .muscle-legend-title { font-size:.68rem; font-weight:800; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); margin-bottom:10px; }
    .muscle-chips { display:flex; flex-wrap:wrap; gap:5px; }
    .muscle-chip {
      padding:3px 9px; border-radius:20px; font-size:.7rem; font-weight:700;
      border:1px solid rgba(255,255,255,0.13); color:var(--muted);
      background:rgba(255,255,255,0.06);
    }
    .muscle-chip.active {
      background:rgba(45,212,110,.15); border-color:rgba(45,212,110,.4); color:var(--acc);
    }

    .sec-label {
      font-size:.65rem; font-weight:800; text-transform:uppercase; letter-spacing:1.2px;
      color:var(--muted); margin-bottom:10px; display:flex; align-items:center; gap:8px;
    }
    .sec-label::after { content:''; flex:1; height:1px; background:var(--glass-b); }

    .day-list { margin-bottom:20px; }
    .day-item {
      border-radius:10px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
      margin-bottom:8px; overflow:hidden;
    }
    .day-header {
      display:flex; align-items:center; gap:12px; padding:12px 16px;
      cursor:pointer; transition:background .15s; user-select:none;
    }
    .day-header:hover { background:rgba(255,255,255,0.05); }
    .day-dot { width:8px; height:8px; border-radius:50%; background:var(--acc); opacity:.5; flex-shrink:0; }
    .day-name { font-weight:700; font-size:.88rem; flex:1; }
    .day-count { color:var(--muted); font-size:.72rem; }
    .day-arrow { color:var(--muted); font-size:.7rem; transition:transform .2s; }
    .day-item.open .day-arrow { transform:rotate(180deg); }
    .day-exs {
      max-height:0; overflow:hidden; transition:max-height .35s ease;
      border-top:1px solid transparent;
    }
    .day-item.open .day-exs { max-height:600px; border-top-color:rgba(255,255,255,0.06); }
    .ex-row {
      display:flex; align-items:center; gap:12px; padding:9px 16px;
      border-bottom:1px solid rgba(255,255,255,0.04); font-size:.83rem;
    }
    .ex-row:last-child { border-bottom:none; }
    .ex-name { flex:1; font-weight:600; }
    .ex-meta { color:var(--muted); font-size:.75rem; white-space:nowrap; }

    .add-btn {
      width:100%; padding:13px; border:none; border-radius:10px;
      font-weight:900; font-size:.95rem; cursor:pointer; transition:all .25s;
      background:var(--acc); color:#061a0c;
    }
    .add-btn:hover { filter:brightness(1.12); transform:translateY(-1px); }
    .add-btn.added {
      background:rgba(45,212,110,.15); color:var(--acc);
      border:1px solid rgba(45,212,110,.4); cursor:default;
      transform:none; filter:none;
    }

    #wt-toast {
      position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
      background:var(--acc); color:#061a0c; font-weight:800; font-size:.85rem;
      padding:11px 24px; border-radius:10px; z-index:400;
      opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap;
    }

    @media(max-width:600px) {
      .muscle-overview { flex-direction:column; }
    }
  </style>
</head>

function uid() { return Math.random().toString(36).slice(2,9); }
function load(k,d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch { return d; } }
function persist(k,v) { localStorage.setItem(k, JSON.stringify(v)); }

function showToast(msg) {
  const t = document.getElementById('wt-toast');
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._t);
  t._t = setTimeout(() => t.style.opacity = '0', 2800);
}

function diffBadgeClass(d) {
  if (d === 'Beginner' || d === 'All Levels') return 'badge badge-green';
  if (d === 'Advanced') return 'badge badge-red';
  return 'badge badge-amber';
}

function isAlreadyAdded(presetId) {
  const routines = load(LS_R, []);
  return routines.some(r => r._presetId === presetId);
}

function addToRoutines(presetId) {
  const preset = PRESETS.find(p => p.id === presetId);
  if (!preset) return;
  const routines = load(LS_R, []);
  if (routines.some(r => r._presetId === presetId)) {
    showToast('Already in your routines');
    return;
  }
  const newRoutine = {
    id: uid(),
    name: preset.name,
    _presetId: presetId,
    days: preset.days.map(d => ({
      id: uid(),
      name: d.name,
      muscles: d.muscles || [],
      exercises: d.exercises.map(e => ({
        id: uid(),
        name: e.name,
        sets: e.sets,
        reps: e.reps,
        weight: e.weight || 0,
        notes: e.notes || '',
      }))
    }))
  };
  routines.push(newRoutine);
  persist(LS_R, routines);
  showToast(`✓ ${preset.name} added to your routines!`);
  const btn = document.getElementById('add-btn-' + presetId);
  if (btn) {
    btn.textContent = '✓ Added to Routines';
    btn.classList.add('added');
    btn.onclick = null;
  }
}

function toggleDay(el) {
  el.closest('.day-item').classList.toggle('open');
}

function toggleCard(el) {
  el.closest('.prog-card').classList.toggle('open');
}

function allMuscles(preset) {
  const s = new Set();
  preset.days.forEach(d => (d.muscles || []).forEach(m => s.add(m)));
  return [...s];
}

function renderCard(preset) {
  const muscles = allMuscles(preset);
  const frontMuscles = muscles.filter(id => MUSCLES.find(m => m.id===id && m.front));
  const backMuscles  = muscles.filter(id => MUSCLES.find(m => m.id===id && !m.front));
  const added = isAlreadyAdded(preset.id);

  const daysHtml = preset.days.map((d, i) => `
    <div class="day-item">
      <div class="day-header" onclick="toggleDay(this)">
        <span class="day-dot"></span>
        <span class="day-name">${d.name}</span>
        <span class="day-count">${d.exercises.length} exercises</span>
        <span class="day-arrow">▼</span>
      </div>
      <div class="day-exs">
        ${d.exercises.map(e => `
          <div class="ex-row">
            <span class="ex-name">${e.name}</span>
            <span class="ex-meta">${e.sets} × ${e.reps}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');

  const muscleChipsHtml = MUSCLES.map(m => {
    const active = muscles.includes(m.id);
    return `<span class="muscle-chip${active?' active':''}">${m.label}</span>`;
  }).join('');

  return `
    <div class="prog-card" id="prog-${preset.id}" data-difficulty="${preset.difficulty}" data-days="${preset.days_per_week}">
      <div class="prog-header" onclick="toggleCard(this)">
        <div class="prog-icon">${preset.icon}</div>
        <div class="prog-main">
          <div class="prog-name">${preset.name}</div>
          <div class="prog-tagline">${preset.tagline}</div>
          <div class="prog-badges">
            <span class="${diffBadgeClass(preset.difficulty)}">${preset.difficulty}</span>
            <span class="badge">${preset.freq}</span>
            <span class="badge">${preset.days.length} workout days</span>
          </div>
        </div>
        <span class="prog-chevron">▼</span>
      </div>
      <div class="prog-body">
        <div class="prog-body-inner">
          <p style="color:var(--muted);font-size:.85rem;line-height:1.65;margin-bottom:20px;">${preset.description}</p>

          <div class="sec-label">Muscle Coverage</div>
          <div class="muscle-overview">
            <div class="body-pair">
              <div class="body-figure">
                <div class="body-label">Front</div>
                ${bodySVG(frontMuscles, 'front', 88)}
              </div>
              <div class="body-figure">
                <div class="body-label">Back</div>
                ${bodySVG(backMuscles, 'back', 88)}
              </div>
            </div>
            <div class="muscle-legend">
              <div class="muscle-legend-title">Muscles Targeted</div>
              <div class="muscle-chips">${muscleChipsHtml}</div>
            </div>
          </div>

          <div class="sec-label" style="margin-top:20px;">Workout Days</div>
          <div class="day-list">${daysHtml}</div>

          <button
            class="add-btn${added?' added':''}"
            id="add-btn-${preset.id}"
            onclick="${added?'':`addToRoutines('${preset.id}')`}"
          >${added ? '✓ Added to Routines' : '+ Add to My Routines'}</button>
        </div>
      </div>
    </div>
  `;
}

function render(filter) {
  const grid = document.getElementById('prog-grid');
  const filtered = filter === 'all' ? PRESETS : PRESETS.filter(p => {
    if (filter === '3') return p.days_per_week === 3;
    if (filter === '4') return p.days_per_week === 4;
    if (filter === '5') return p.days_per_week === 5;
    if (filter === '6') return p.days_per_week === 6;
    return p.difficulty.includes(filter);
  });
  grid.innerHTML = filtered.map(p => renderCard(p)).join('');
}

document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    render(chip.dataset.filter);
  });
});

render('all');
</script>
